<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Escáner de Códigos</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #000; color: #fff;
    font: 16px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; overflow: hidden;
  }

  #stage { position: relative; flex: 1 1 auto; min-height: 0; background: #000; overflow: hidden; }

  #video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; display: block; background: #000; z-index: 0;
  }

  #overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  #rect {
    position: absolute;
    border: 2px solid rgba(255,255,255,0.85);
    border-radius: 14px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
    transition: border-color .15s ease, box-shadow .15s ease;
    opacity: 0;
  }
  #rect.on  { opacity: 1; }
  #rect.hit {
    border-color: #6ee7a8;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45), 0 0 22px rgba(110,231,168,0.75);
  }

  /* Full-stage tap catcher — sits below the panel/topbar, above the video.
     This is what turns "touch anywhere" into "start scanning". */
  #tapCatch {
    position: absolute; inset: 0;
    z-index: 1;
    background: transparent;
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
  }
  #tapCatch.off { pointer-events: none; }

  /* Small floating controls while running (stop, torch) */
  #fabs {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top));
    right: 12px;
    z-index: 3;
    display: flex; gap: 8px;
  }
  #fabs[hidden] { display: none; }
  .fab {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(20,20,24,0.82);
    border: 1px solid rgba(255,255,255,0.14);
    color: #fff; font: inherit; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    padding: 0;
  }
  .fab[hidden] { display: none; }
  #torchFab.on { background: #fbbf24; color: #1a1a1a; border-color: #fbbf24; }

  /* 3-second toast */
  #toast {
    position: absolute;
    left: 50%; top: 34%;
    transform: translate(-50%, -50%);
    background: rgba(20,20,24,0.92);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 14px 22px;
    border-radius: 14px;
    font-size: 15px; font-weight: 700;
    color: #fff;
    z-index: 5;
    opacity: 0;
    transition: opacity .25s ease;
    pointer-events: none;
    text-align: center;
    max-width: 82%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    line-height: 1.35;
  }
  #toast.on { opacity: 1; }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(10px + env(safe-area-inset-top)) 12px 0;
    z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }

  #status {
    font-size: 12px; color: #9aa0a6; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.95);
    padding-right: 92px; /* avoid FABs */
  }

  #logWrap {
    width: 100%; max-width: 460px;
    background: rgba(0,0,0,0.72);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 6px 10px;
    pointer-events: none;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #log {
    margin: 0; font-family: ui-monospace, monospace;
    font-size: 10.5px; line-height: 1.45; color: #b8bcc2;
    white-space: pre-wrap; word-break: break-word;
    max-height: 62px; overflow: hidden;
  }
  #log .err { color: #ef9a9a; }
  #log .ok  { color: #6ee7a8; }
  #log .warn{ color: #fbbf24; }

  #panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 24px 16px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.92) 35%);
    max-height: 62%; overflow-y: auto; -webkit-overflow-scrolling: touch;
    z-index: 2;
  }

  #code {
    font-size: clamp(20px, 7vw, 38px); font-weight: 700;
    line-height: 1.15; text-align: center; word-break: break-all;
    transition: color .12s ease;
  }
  #code.hit { color: #6ee7a8; }

  #gs1 {
    margin-top: 8px; font-size: 13px; color: #9aa0a6;
    text-align: center; line-height: 1.6;
  }

  #product {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid #2a2a2e;
    font-size: 14px; line-height: 1.5; color: #d0d0d5; display: none;
  }
  #product.visible { display: block; }
  #product .name { font-size: 18px; font-weight: 700; color: #fff; text-align: center; }
  #product .brand { color: #9aa0a6; text-align: center; }
  #product .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  #product .badge { padding: 3px 8px; border-radius: 6px; background: #1c1c1f; font-size: 12px; color: #ccc; }
  #product .badge.grade-a { background: #0f5132; color: #6ee7a8; }
  #product .badge.grade-b { background: #3d5a00; color: #d4e157; }
  #product .badge.grade-c { background: #6d5200; color: #ffd54f; }
  #product .badge.grade-d { background: #7a2e00; color: #ffab91; }
  #product .badge.grade-e { background: #6b1c1c; color: #ef9a9a; }

  /* Ingredients — appear AFTER the analysis block */
  #ingredients {
    margin-top: 18px; padding-top: 14px; border-top: 1px solid #2a2a2e;
    font-size: 12px; color: #9aa0a6; line-height: 1.55;
    display: none;
  }
  #ingredients.visible { display: block; }
  #ingredients b { color: #d0d0d5; font-weight: 700; display: block; margin-bottom: 4px; }

  /* ===================== PATIENT PROFILE ===================== */
  #profileCard {
    margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px;
    background: rgba(18,18,22,0.88);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    overflow: hidden;
  }
  #profileToggle {
    width: 100%;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px;
    background: transparent; border: 0; color: #fff;
    font: inherit; font-size: 13.5px; font-weight: 700;
    cursor: pointer; text-align: left;
  }
  #profileToggle .ptitle { flex: 0 0 auto; }
  #profileSummary {
    margin-left: auto; color: #9aa0a6; font-weight: 400; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48%;
  }
  #profileToggle .chev { color: #9aa0a6; transition: transform .2s; flex: 0 0 auto; }
  #profileCard.open #profileToggle .chev { transform: rotate(180deg); }

  #profileBody { display: none; padding: 0 14px 14px; }
  #profileCard.open #profileBody { display: block; }

  .field-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .field { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label {
    font-size: 10.5px; color: #9aa0a6;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .field input, .field select {
    width: 100%; padding: 9px 10px; font: inherit; font-size: 14px;
    background: #0d0d11; color: #fff;
    border: 1px solid #2a2a2e; border-radius: 8px;
  }
  .field input:focus, .field select:focus { outline: none; border-color: #1f6feb; }

  .cond-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 6px;
    margin-top: 6px;
  }
  .cond {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px; border-radius: 9px;
    background: #0d0d11; border: 1px solid #232326;
    font-size: 12.5px; cursor: pointer; user-select: none;
    transition: background .12s, border-color .12s;
    line-height: 1.25;
  }
  .cond input { display: none; }
  .cond .tick {
    width: 18px; height: 18px; border-radius: 5px; flex: 0 0 auto;
    border: 2px solid #3a3a40;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: transparent;
    transition: all .12s;
  }
  .cond.on { background: #14223c; border-color: #1f6feb; }
  .cond.on .tick { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .cond .ico { font-size: 15px; flex: 0 0 auto; }

  .profile-note { font-size: 11px; color: #6b6b70; margin-top: 12px; text-align: center; }

  /* ===================== ANALYSIS ===================== */
  #analysis { display: none; }
  #analysis.visible { display: block; }

  .score-wrap {
    display: flex; align-items: center; gap: 14px;
    margin: 14px 0 4px;
  }
  .score-circle {
    width: 68px; height: 68px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 23px; font-weight: 800; color: #fff;
    background: var(--c, #444);
    box-shadow: 0 0 0 4px rgba(255,255,255,0.05), 0 0 22px -6px var(--c, #444);
    font-variant-numeric: tabular-nums;
  }
  .score-meta { flex: 1; min-width: 0; }
  .score-title { font-size: 14px; font-weight: 800; letter-spacing: .3px; }
  .score-sub { font-size: 11.5px; color: #9aa0a6; margin-top: 3px; }

  .tl-title {
    font-size: 10.5px; color: #9aa0a6; text-transform: uppercase;
    letter-spacing: .7px; margin: 16px 0 6px; font-weight: 700;
  }
  .tl-row { display: flex; align-items: center; gap: 9px; padding: 4px 0; }
  .tl-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .tl-name { flex: 0 0 96px; font-size: 12.5px; color: #d0d0d5; }
  .tl-bar {
    flex: 1 1 auto; height: 8px; border-radius: 4px;
    background: #202024; overflow: hidden;
  }
  .tl-fill { display: block; height: 100%; border-radius: 4px; transition: width .25s ease; }
  .tl-val {
    flex: 0 0 auto; font-size: 11.5px; color: #b8bcc2;
    font-variant-numeric: tabular-nums; min-width: 66px; text-align: right;
  }

  .cond-list { display: flex; flex-direction: column; gap: 8px; }
  .cond-card {
    padding: 10px 12px; border-radius: 10px;
    background: #121218; border-left: 4px solid #444;
  }
  .cond-card.good { border-left-color: #22c55e; }
  .cond-card.warn { border-left-color: #fbbf24; }
  .cond-card.bad  { border-left-color: #ef4444; }
  .cond-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700;
  }
  .cond-head .ico { font-size: 15px; }
  .cond-score {
    margin-left: auto; font-size: 13.5px;
    font-variant-numeric: tabular-nums; font-weight: 800;
  }
  .cond-note {
    font-size: 11.5px; color: #9aa0a6; margin-top: 5px; line-height: 1.5;
  }
</style>
</head>
<body>

  <div id="stage">
    <video id="video" playsinline webkit-playsinline muted autoplay></video>
    <div id="overlay"><div id="rect"></div></div>
    <div id="tapCatch"></div>

    <div id="toast"></div>

    <div id="fabs" hidden>
      <button id="torchFab" class="fab" hidden title="Linterna">🔦</button>
      <button id="stopFab" class="fab" title="Detener">✕</button>
    </div>

    <div id="topbar">
      <div id="status">Toca la pantalla para escanear</div>
      <div id="logWrap"><pre id="log">listo.</pre></div>
    </div>

    <div id="panel">

      <div id="profileCard">
        <button id="profileToggle" type="button">
          <span class="ico">👤</span>
          <span class="ptitle">Perfil del paciente</span>
          <span id="profileSummary">no configurado</span>
          <span class="chev">▾</span>
        </button>
        <div id="profileBody">
          <div class="field-row">
            <div class="field">
              <label for="pAge">Edad</label>
              <input id="pAge" type="number" min="0" max="120" inputmode="numeric" placeholder="—">
            </div>
            <div class="field">
              <label for="pSex">Sexo</label>
              <select id="pSex">
                <option value="">—</option>
                <option value="female">Mujer</option>
                <option value="male">Hombre</option>
                <option value="other">Otro</option>
              </select>
            </div>
            <div class="field">
              <label for="pWeight">Peso kg</label>
              <input id="pWeight" type="number" min="0" max="400" inputmode="decimal" placeholder="—">
            </div>
          </div>

          <div class="tl-title" style="margin-top:0">Condiciones de salud</div>
          <div class="cond-grid" id="condGrid"></div>

          <div class="profile-note">Guardado solo en este dispositivo · no es consejo médico</div>
        </div>
      </div>

      <div id="code">—</div>
      <div id="gs1"></div>
      <div id="product">
        <div class="name"></div>
        <div class="brand"></div>
        <div class="meta"></div>
        <div id="analysis"></div>
        <div id="ingredients"></div>
      </div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------- refs
  const video     = document.getElementById('video');
  const stage     = document.getElementById('stage');
  const rectEl    = document.getElementById('rect');
  const codeEl    = document.getElementById('code');
  const gs1El     = document.getElementById('gs1');
  const productEl = document.getElementById('product');
  const nameEl    = productEl.querySelector('.name');
  const brandEl   = productEl.querySelector('.brand');
  const metaEl    = productEl.querySelector('.meta');
  const ingredientsEl = document.getElementById('ingredients');
  const analysisEl    = document.getElementById('analysis');
  const statusEl  = document.getElementById('status');
  const logEl     = document.getElementById('log');
  const tapCatch  = document.getElementById('tapCatch');
  const toastEl   = document.getElementById('toast');
  const fabsEl    = document.getElementById('fabs');
  const stopFab   = document.getElementById('stopFab');
  const torchFab  = document.getElementById('torchFab');

  // ------------------------------------------------------------- constants
  // Solo formatos 1D — el soporte de QR / 2D se ha eliminado por completo.
  const BARCODE_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e',
                            'code_128', 'code_39', 'code_93', 'itf', 'codabar'];

  // Un código por debajo de esta longitud se considera un falso positivo
  // (ruido, reflejos, fragmentos) y se ignora sin detener el escaneo.
  const MIN_CODE_LENGTH = 8;

  // Recortamos solo la región del visor del vídeo a resolución (casi)
  // nativa y decodificamos ese recorte — no el fotograma completo reducido.
  const CROP_MAX_DIM  = 1400;
  const CROP_PADDING  = 0.08;

  const OFF_BASE = 'https://world.openfoodfacts.org/api/v2/product/';
  const CORS_PROXIES = [
    { name: 'corsproxy.io',  build: (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u) },
    { name: 'allorigins',    build: (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) },
    { name: 'thingproxy',    build: (u) => 'https://thingproxy.freeboard.io/fetch/' + u }
  ];

  const ZXING_URLS = [
    'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js',
    'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'
  ];

  const GS1_PREFIXES = {
    '000':'EE.UU./Canadá','001':'EE.UU./Canadá','002':'EE.UU./Canadá','003':'EE.UU./Canadá',
    '004':'EE.UU./Canadá','005':'EE.UU./Canadá','006':'EE.UU./Canadá','007':'EE.UU./Canadá',
    '008':'EE.UU./Canadá','009':'EE.UU./Canadá','010':'EE.UU./Canadá','011':'EE.UU./Canadá',
    '012':'EE.UU./Canadá','013':'EE.UU./Canadá','014':'EE.UU./Canadá','015':'EE.UU./Canadá',
    '016':'EE.UU./Canadá','017':'EE.UU./Canadá','018':'EE.UU./Canadá','019':'EE.UU./Canadá',
    '020':'EE.UU./Canadá (restringido)','029':'EE.UU./Canadá (restringido)',
    '030':'EE.UU. (GS1 US)','036':'EE.UU. (GS1 US)','037':'EE.UU. (GS1 US)',
    '038':'EE.UU. (GS1 US)','039':'EE.UU. (GS1 US)','040':'EE.UU. (GS1 US)',
    '050':'EE.UU. (GS1 US)','060':'EE.UU. (GS1 US)','070':'EE.UU. (GS1 US)',
    '080':'EE.UU. (GS1 US)','090':'EE.UU. (GS1 US)','100':'EE.UU. (GS1 US)',
    '110':'EE.UU. (GS1 US)','120':'EE.UU. (GS1 US)','130':'EE.UU. (GS1 US)',
    '200':'Distribución restringida',
    '300':'Francia','310':'Francia','320':'Francia','330':'Francia','340':'Francia',
    '350':'Francia','360':'Francia','370':'Francia','380':'Bulgaria',
    '400':'Alemania','410':'Alemania','420':'Alemania','430':'Alemania','440':'Alemania',
    '450':'Japón','460':'Rusia','470':'Kirguistán','480':'Filipinas','490':'Japón',
    '500':'Reino Unido','509':'Reino Unido',
    '520':'Grecia','530':'Chipre','540':'Bélgica/Luxemburgo',
    '560':'Portugal','570':'Dinamarca','590':'Polonia',
    '600':'Sudáfrica','610':'Mauricio','620':'Tanzania',
    '640':'Finlandia','690':'China','693':'China','694':'China',
    '700':'Noruega','729':'Israel','740':'Guatemala',
    '750':'México','760':'Suiza','770':'Colombia',
    '775':'Perú','779':'Argentina','780':'Chile',
    '789':'Brasil','790':'Brasil',
    '800':'Italia','810':'Italia','820':'Italia','830':'Italia',
    '840':'España','850':'Cuba','858':'Eslovaquia',
    '860':'Serbia','869':'Turquía','870':'Países Bajos',
    '880':'Corea del Sur','885':'Tailandia','888':'Singapur',
    '890':'India','893':'Vietnam','899':'Indonesia',
    '900':'Austria','910':'Austria','920':'Austria',
    '930':'Australia','940':'Nueva Zelanda','950':'Taiwán',
    '955':'Malasia','958':'Macao'
  };

  const DETECT_INTERVAL      = 100;
  const DEDUPE_MS            = 1500;
  const LOG_MAX              = 5;
  const DETECT_LOG_THROTTLE  = 500;
  const TOAST_MS             = 3000;

  const EXTRA_ROTATIONS = [90, 180, 270];

  // ---------------------------------------------------------------- state
  let running         = false;
  let rafId           = 0;
  let rvfcHandle      = 0;
  let busy            = false;
  let lastTick        = 0;
  let stream          = null;
  let nativeDetector  = null;
  let zxingCore       = null;
  let torchTrack      = null;
  let torchOn         = false;
  let rotCursor       = 0;
  let lastText        = '';
  let lastAt          = 0;
  let lastLookupCode  = '';
  let lookupId        = 0;
  let flashTimer      = 0;
  let lastDetectLog   = 0;
  let lastProductData = null;
  let toastTimer      = 0;

  const cropCanvas = document.createElement('canvas');
  cropCanvas.style.display = 'none';
  document.body.appendChild(cropCanvas);
  const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });

  const rotCanvas = document.createElement('canvas');
  rotCanvas.style.display = 'none';
  document.body.appendChild(rotCanvas);
  const rotCtx = rotCanvas.getContext('2d', { willReadFrequently: true });

  // ---------------------------------------------------------------- log
  const logLines = [];
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function log(msg, cls) {
    const t = new Date().toLocaleTimeString('es-ES', { hour12: false });
    const line = '[' + t + '] ' + msg;
    logLines.push(cls ? '<span class="' + cls + '">' + escapeHtml(line) + '</span>' : escapeHtml(line));
    while (logLines.length > LOG_MAX) logLines.shift();
    logEl.innerHTML = logLines.join('\n');
  }
  function logThrottled(msg, cls) {
    const now = Date.now();
    if (now - lastDetectLog < DETECT_LOG_THROTTLE) return;
    lastDetectLog = now;
    log(msg, cls);
  }

  function setStatus(t) { statusEl.textContent = t; }

  function showToast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms || TOAST_MS);
  }

  function clearProduct() {
    productEl.classList.remove('visible');
    nameEl.textContent = '';
    brandEl.textContent = '';
    metaEl.innerHTML = '';
    ingredientsEl.textContent = '';
    ingredientsEl.classList.remove('visible');
    analysisEl.innerHTML = '';
    analysisEl.classList.remove('visible');
    lastProductData = null;
  }

  // ------------------------------------------------------------ GS1 parse
  function parseGS1(raw) {
    const code = String(raw).replace(/\D/g, '');
    if (code.length !== 12 && code.length !== 13) return null;

    const full         = code.length === 12 ? '0' + code : code;
    const prefix       = full.substring(0, 3);
    const manufacturer = full.substring(3, 8);
    const productCode  = full.substring(8, 12);
    const checkDigit   = full.substring(12, 13);

    let sum = 0;
    for (let i = 0; i < 12; i++) sum += Number(full[i]) * (i % 2 === 0 ? 1 : 3);
    const calc  = (10 - (sum % 10)) % 10;
    const valid = calc === Number(checkDigit);

    let country = GS1_PREFIXES[prefix] || GS1_PREFIXES[prefix.substring(0, 2)] || null;

    return {
      full,
      format: code.length === 12 ? 'UPC-A' : 'EAN-13',
      prefix, manufacturer, productCode, checkDigit, valid,
      country: country || 'Desconocido / ver lista de prefijos GS1'
    };
  }

  function showGS1(parsed) {
    if (!parsed) { gs1El.textContent = ''; return; }
    gs1El.innerHTML =
      parsed.format + ' · ' + (parsed.valid ? 'dígito de control OK' : 'dígito de control FALLIDO') + '<br>' +
      'Región: ' + parsed.country +
      ' · Fabricante: ' + parsed.manufacturer +
      ' · Producto: ' + parsed.productCode;
  }

  // ------------------------------------------------------ Open Food Facts
  async function fetchWithProxies(url) {
    log('OFF: consulta directa…');
    try {
      const r = await fetch(url, { headers: { 'User-Agent': 'BarcodeScanner/1.0' }, mode: 'cors' });
      if (r.ok) { log('OFF: directa OK', 'ok'); return r; }
      log('OFF: directa HTTP ' + r.status, 'warn');
    } catch (e) {
      const m = e && e.message ? e.message : 'CORS/red';
      log('OFF: directa bloqueada — ' + m, 'warn');
    }
    for (const p of CORS_PROXIES) {
      log('OFF: vía ' + p.name + '…');
      try {
        const r = await fetch(p.build(url));
        if (r.ok) { log('OFF: ' + p.name + ' OK', 'ok'); return r; }
        log('OFF: ' + p.name + ' HTTP ' + r.status, 'warn');
      } catch (e) {
        const m = e && e.message ? e.message : 'fallo';
        log('OFF: ' + p.name + ' — ' + m, 'warn');
      }
    }
    throw new Error('Todas las consultas han fallado (CORS o red)');
  }

  function gradeClass(grade) {
    if (!grade) return '';
    const g = String(grade).toLowerCase();
    return 'abcde'.indexOf(g) !== -1 ? 'grade-' + g : '';
  }

  function renderProduct(p) {
    if (!p) { clearProduct(); return; }
    lastProductData = p;

    nameEl.textContent = p.product_name || '(sin nombre)';
    brandEl.textContent = [p.brands, p.quantity].filter(Boolean).join(' · ');
    metaEl.innerHTML = '';
    if (p.nutrition_grades) {
      const b = document.createElement('span');
      b.className = 'badge ' + gradeClass(p.nutrition_grades);
      b.textContent = 'Nutri-Score ' + p.nutrition_grades.toUpperCase();
      metaEl.appendChild(b);
    }
    if (p.nova_group) {
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = 'NOVA ' + p.nova_group;
      metaEl.appendChild(b);
    }

    if (p.ingredients_text) {
      ingredientsEl.innerHTML = '<b>Ingredientes</b>' + escapeHtml(p.ingredients_text);
      ingredientsEl.classList.add('visible');
    } else {
      ingredientsEl.textContent = '';
      ingredientsEl.classList.remove('visible');
    }

    productEl.classList.add('visible');
    renderAnalysis();
  }

  async function lookupOFF(barcode) {
    const digits = String(barcode).replace(/\D/g, '');
    if (digits.length !== 8 && digits.length !== 12 && digits.length !== 13) return;
    if (digits === lastLookupCode) return;
    lastLookupCode = digits;

    const id = ++lookupId;
    clearProduct();
    setStatus('Analizando producto…');
    log('Consulta OFF: ' + digits);

    try {
      const url = OFF_BASE + encodeURIComponent(digits) +
        '?fields=product_name,brands,quantity,nutrition_grades,nova_group,' +
        'nutriments,ingredients_text,allergens_tags,additives_tags,categories_tags';
      const res = await fetchWithProxies(url);
      if (id !== lookupId) return;
      if (!res.ok) {
        log('OFF: HTTP ' + res.status, 'err');
        setStatus('OFF HTTP ' + res.status);
        return;
      }
      const data = await res.json();
      if (id !== lookupId) return;
      if (data.status !== 1 || !data.product) {
        log('OFF: no encontrado', 'warn');
        setStatus('No encontrado en Open Food Facts');
        return;
      }
      renderProduct(data.product);
      log('OFF: encontrado "' + (data.product.product_name || '') + '"', 'ok');
      setStatus('Producto encontrado');
    } catch (err) {
      if (id !== lookupId) return;
      const m = err && err.message ? err.message : String(err);
      log('OFF: ' + m, 'err');
      setStatus('Error al consultar OFF');
    }
  }

    energy: 'Calorías', fat: 'Grasas', saturated: 'Grasas saturadas',

    fiber: 'Fibra', proteins: 'Proteínas'
  };

  // Umbrales de semáforo delantero (FSA / NHS), por 100 g.
  const TL = {
    fat:       { green: 3.0, red: 17.5, label: 'Grasas' },
    saturated: { green: 1.5, red: 5.0,  label: 'Grasas saturadas' },
    sugars:    { green: 5.0, red: 22.5, label: 'Azúcares' },
    salt:      { green: 0.3, red: 1.5,  label: 'Sal' }
  };

  // Parámetros revisados por condición. Los pesos indican cuánto importa
  // cada nutriente para esa condición; los nutrientes ausentes en la regla
  // no se tienen en cuenta para esa condición.
  const CONDITION_RULES = {
    // Diabetes tipo 1: el impacto glucémico inmediato depende sobre todo de
    // azúcares y carga de carbohidratos. La fibra ralentiza la absorción.
    type1diabetes: { nutrients: { sugars: 3, carbohydrates: 2, fiber: 2 } },

    // Diabetes tipo 2: resistencia a la insulina. Azúcares y carbohidratos
    // refinados son clave; la fibra es claramente beneficiosa.
    diabetes:      { nutrients: { sugars: 3, carbohydrates: 1.5, fiber: 2, energy: 1 } },

    // Prediabetes: mismo foco que tipo 2 con algo más de peso al total de
    // carbohidratos y a la densidad energética para prevenir progresión.
    prediabetes:   { nutrients: { sugars: 3, carbohydrates: 2, fiber: 2, energy: 1 } },

    // Hipertensión: el sodio (sal) es el factor dietético dominante. La
    // grasa saturada se incluye por riesgo cardiovascular asociado.
    hbp:           { nutrients: { salt: 4, saturated: 1.5 } },

    // Colesterol alto: la grasa saturada es el principal determinante
    // dietético del LDL. La fibra soluble ayuda a reducirlo.
    cholesterol:   { nutrients: { saturated: 3.5, fat: 1, fiber: 2 } },

    // Enfermedad renal: restricción de sodio y control de proteínas.
    // La grasa saturada importa por el alto riesgo cardiovascular.
    ckd:           { nutrients: { salt: 4, proteins: 2, saturated: 1 } },

    // Control de peso: densidad energética primero, seguida de azúcares
    // y grasa saturada. La fibra aporta saciedad.
    obesity:       { nutrients: { energy: 3, sugars: 2, saturated: 1.5, fiber: 2 } },

    // Gota: la fructosa/azúcares elevan el ácido úrico. También influyen
    // el exceso de proteína y el sobrepeso.
    gout:          { nutrients: { sugars: 2.5, proteins: 1.5, energy: 1 } },

    // SII: la grasa y los azúcares son desencadenantes frecuentes. La fibra
    // es ambigua (insoluble empeora, soluble ayuda) → sin peso.
    ibs:           { nutrients: { fat: 2, sugars: 1.5 } },

    // Embarazo: patrón dietético saludable general. El sodio no se
    // restringe en embarazo normal (incluso aumenta la necesidad).
    pregnancy:     { nutrients: { sugars: 2, saturated: 1.5, proteins: 1.5 } },

    // Alérgenos: se comprueban contra allergens_tags.
    celiac:        { allergen: 'gluten' },
    lactose:       { allergen: 'milk' },
    nutallergy:    { allergen: 'nuts' }

  const DEFAULT_PROFILE = { age: '', sex: '', weight: '', conditions: {} };

  function loadProfile() {

        age: p && p.age != null ? p.age : '',
        sex: p && p.sex != null ? p.sex : '',
        weight: p && p.weight != null ? p.weight : '',
        conditions: (p && p.conditions && typeof p.conditions === 'object') ? p.conditions : {}
      };
    } catch (_) {
      return JSON.parse(JSON.stringify(DEFAULT_PROFILE));
    }
  }

  function saveProfile() {
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); }
    catch (e) { log('No se pudo guardar el perfil: ' + (e.message || e), 'warn'); }

  let profile = loadProfile();

  const profileCard    = document.getElementById('profileCard');

  function buildConditionGrid() {

  // ------------------------- nutrient extraction -------------------------

  function pick() {
    for (let i = 0; i < arguments.length; i++) {
      if (arguments[i] != null) return arguments[i];
    }
    return null;
  }

  function numOr(v) {
    if (v === '' || v == null) return null;
    const n = Number(v);
    return isFinite(n) ? n : null;
  }

  function extractNutrients(p) {
    const nu = (p && p.nutriments) || {};
    const sodium = numOr(nu.sodium_100g);
    const salt   = pick(numOr(nu.salt_100g), sodium != null ? sodium * 2.5 : null);
    const kcal   = numOr(nu['energy-kcal_100g']);
    const kj     = numOr(nu.energy_100g);
    const energy = pick(kcal, kj != null ? kj / 4.184 : null);
    return {
      energy:        energy,
      fat:           numOr(nu.fat_100g),
      saturated:     numOr(nu['saturated-fat_100g']),
      carbohydrates: numOr(nu.carbohydrates_100g),
      sugars:        numOr(nu.sugars_100g),
      fiber:         numOr(nu.fiber_100g),
      proteins:      numOr(nu.proteins_100g),
      salt:          salt
    };
  }

  // ------------------------- scoring primitives -------------------------

  function bandScore(value, green, red) {
    if (value == null) return null;
    if (value <= 0) return 10;
    if (value <= green) return 10 - 2 * (value / green);                  // 8..10
    if (value <= red)   return 8 - 4 * ((value - green) / (red - green)); // 4..8
    const over = Math.min(1, (value - red) / Math.max(red, 0.0001));
    return Math.max(1, 4 - 3 * over);                                     // 1..4
  }

  function positiveScore(value, mid, high) {
    if (value == null) return null;
    if (value >= high) return 10;
    if (value >= mid)  return 7 + 3 * ((value - mid) / (high - mid));
    return 1 + 6 * (value / mid);
  }

  function scoreNutrient(key, n, condId) {
    const v = n[key];
    if (v == null) return null;
    switch (key) {
      case 'fat':           return bandScore(v, 3.0, 17.5);
      case 'saturated':     return bandScore(v, 1.5, 5.0);
      case 'sugars':        return bandScore(v, 5.0, 22.5);
      case 'salt':          return bandScore(v, 0.3, 1.5);
      case 'carbohydrates': return bandScore(v, 15, 60);
      case 'energy':        return bandScore(v, 150, 400);
      case 'fiber':         return positiveScore(v, 3, 6);
      case 'proteins':
        // En enfermedad renal una carga alta de proteínas es un riesgo.
        if (condId === 'ckd') return bandScore(v, 6, 15);
        return positiveScore(v, 8, 20);
    }
    return null;
  }

  function tlLevel(key, value) {
    if (value == null) return null;
    const t = TL[key];
    if (value <= t.green) return 'green';
    if (value <= t.red)   return 'amber';
    return 'red';
  }

  function fmtNutrient(key, val) {
    if (val == null) return '—';
    if (key === 'energy') return Math.round(val) + ' kcal';
    const dec = (key === 'salt' || key === 'saturated') ? 2 : 1;
    return val.toFixed(dec) + ' g';
  }

  function scoreColor(score) {
    if (score == null) return '#6b6b70';
    if (score >= 7.5) return '#22c55e';
    if (score >= 5)   return '#fbbf24';
    if (score >= 3)   return '#fb923c';
    return '#ef4444';
  }

  function scoreWord(score) {
    if (score == null) return 'Datos insuficientes';
    if (score >= 7.5) return 'Buena elección';
    if (score >= 5)   return 'Aceptable con moderación';
    if (score >= 3)   return 'Limitar consumo';
    return 'Mejor evitar';
  }

  function generalScore(n) {
    const parts = [
      ['fat', 1], ['saturated', 2], ['sugars', 2], ['salt', 2],
      ['fiber', 1.5], ['proteins', 1]
    ];
    let sum = 0, wsum = 0;
    for (const [k, w] of parts) {
      const s = scoreNutrient(k, n);
      if (s == null) continue;
      sum += s * w; wsum += w;
    }
    return wsum ? sum / wsum : null;
  }

  function scoreCondition(condId, n, allergens) {
    const rule = CONDITION_RULES[condId];
    if (!rule) return { score: null, alerts: [], good: [] };

    if (rule.allergen) {
      const has = (allergens || []).some(a =>
        String(a).toLowerCase().indexOf(rule.allergen) !== -1);
      if (has) return { score: 1, alerts: ['Contiene ' + rule.allergen + ' — evitar'], good: [] };
      return { score: 10, alerts: [], good: ['Sin ' + rule.allergen + ' declarado'] };
    }

    let sum = 0, wsum = 0;
    const alerts = [], good = [];
    for (const key in rule.nutrients) {
      if (!Object.prototype.hasOwnProperty.call(rule.nutrients, key)) continue;
      const w = rule.nutrients[key];
      const val = n[key];
      const s = scoreNutrient(key, n, condId);
      if (s == null || val == null) continue;
      sum += s * w; wsum += w;
      if (s <= 4) {
        alerts.push(NUTRIENT_LABELS[key] + ' ' + fmtNutrient(key, val) +
                    ' · ' + (s <= 2 ? 'muy alto' : 'alto'));
      } else if (s >= 8.5 && (key === 'fiber' || key === 'proteins')) {
        good.push('Buena cantidad de ' + NUTRIENT_LABELS[key].toLowerCase());
      }
    }
    return { score: wsum ? sum / wsum : null, alerts, good };
  }

  // --------------------------- analysis render ---------------------------

  function renderAnalysis() {
    if (!lastProductData) {
      analysisEl.innerHTML = '';
      analysisEl.classList.remove('visible');
      return;
    }

    const n = extractNutrients(lastProductData);
    const allergens = lastProductData.allergens_tags || [];
    const activeConds = CONDITIONS.map(c => c.id).filter(id => !!profile.conditions[id]);

    const condResults = activeConds.map(id => {
      const r = scoreCondition(id, n, allergens) || { score: null, alerts: [], good: [] };
      return { id: id, score: r.score, alerts: r.alerts || [], good: r.good || [] };
    });

    let overall = null;
    let overallLabel = '';
    if (activeConds.length) {
      const valid = condResults.filter(r => r.score != null);
      if (valid.length) {
        overall = valid.reduce((s, r) => s + r.score, 0) / valid.length;
        overallLabel = 'Puntuación para tu perfil';
      }
    } else {
      overall = generalScore(n);
      overallLabel = 'Puntuación general';
    }

    const parts = [];

    if (overall != null) {
      const col = scoreColor(overall);
      parts.push(
        '<div class="score-wrap">' +
          '<div class="score-circle" style="--c:' + col + '">' + overall.toFixed(1) + '</div>' +
          '<div class="score-meta">' +
            '<div class="score-title" style="color:' + col + '">' + scoreWord(overall) + '</div>' +
            '<div class="score-sub">' + overallLabel + ' · valores por 100 g</div>' +
          '</div>' +
        '</div>'
      );
    }

    const tlRows = [];
    for (const k of ['sugars', 'salt', 'saturated', 'fat']) {
      if (n[k] == null) continue;
      const lvl = tlLevel(k, n[k]);
      const c = lvl === 'green' ? '#22c55e'
              : lvl === 'amber' ? '#fbbf24'
              : lvl === 'red'   ? '#ef4444'
              : '#3a3a40';
      const pct = Math.min(100, (n[k] / (TL[k].red * 1.6)) * 100);
      tlRows.push(
        '<div class="tl-row">' +
          '<span class="tl-dot" style="background:' + c + '"></span>' +
          '<span class="tl-name">' + TL[k].label + '</span>' +
          '<span class="tl-bar"><span class="tl-fill" style="width:' + pct + '%;background:' + c + '"></span></span>' +
          '<span class="tl-val">' + fmtNutrient(k, n[k]) + '</span>' +
        '</div>'
      );
    }
    if (tlRows.length) {
      parts.push('<div class="tl-title">Semáforo nutricional</div>' + tlRows.join(''));
    }

    const posRows = [];
    for (const [k, maxVal] of [['fiber', 8], ['proteins', 25]]) {
      if (n[k] == null) continue;
      const s = scoreNutrient(k, n);
      const c = scoreColor(s);
      const pct = Math.min(100, (n[k] / maxVal) * 100);
      posRows.push(
        '<div class="tl-row">' +
          '<span class="tl-dot" style="background:' + c + '"></span>' +
          '<span class="tl-name">' + NUTRIENT_LABELS[k] + '</span>' +
          '<span class="tl-bar"><span class="tl-fill" style="width:' + pct + '%;background:' + c + '"></span></span>' +
          '<span class="tl-val">' + fmtNutrient(k, n[k]) + '</span>' +
        '</div>'
      );
    }
    if (posRows.length) {
      parts.push('<div class="tl-title">Beneficiosos</div>' + posRows.join(''));
    }

    if (activeConds.length) {
      const cards = [];
      for (const r of condResults) {
        const cdef = CONDITIONS.find(x => x.id === r.id) || { label: r.id, icon: '' };
        const s = r.score;
        const hasAlerts = r.alerts && r.alerts.length > 0;
        const hasGood   = r.good && r.good.length > 0;
        if (s == null && !hasAlerts && !hasGood) continue;

        const cls = s == null ? '' : s >= 7.5 ? 'good' : s >= 5 ? 'warn' : 'bad';
        const notes = [];
        if (hasAlerts) notes.push('⚠ ' + r.alerts.join(' · '));
        else if (s != null && s >= 7.5) notes.push('✓ Sin problemas importantes');
        if (hasGood) notes.push('✓ ' + r.good.join(' · '));

        cards.push(
          '<div class="cond-card ' + cls + '">' +
            '<div class="cond-head">' +
              '<span class="ico">' + cdef.icon + '</span>' +
              '<span>' + cdef.label + '</span>' +
              '<span class="cond-score" style="color:' + scoreColor(s) + '">' +
                (s == null ? '—' : s.toFixed(1) + '/10') +
              '</span>' +
            '</div>' +
            (notes.length ? '<div class="cond-note">' + notes.join('<br>') + '</div>' : '') +
          '</div>'
        );
      }
      if (cards.length) {
        parts.push(
          '<div class="tl-title">Para tus condiciones</div>' +
          '<div class="cond-list">' + cards.join('') + '</div>'
        );
      }
    } else if (overall != null) {
      parts.push(
        '<div class="profile-note" style="margin-top:14px">' +
        'Añade condiciones de salud en tu perfil para una puntuación personalizada.' +
        '</div>'
      );
    }

    if (parts.length) {
      parts.push('<div class="profile-note">Solo orientativo — no es consejo médico.</div>');
      analysisEl.innerHTML = parts.join('');
      analysisEl.classList.add('visible');
    } else {
      analysisEl.innerHTML = '';
      analysisEl.classList.remove('visible');
    }
  }

  // --------------------------------------------------- viewfinder region
  function getRegion(vw, vh) {
    return { x: 0.06, y: 0.18, w: 0.88, h: 0.64 };
  }

  function updateOverlay() {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) { rectEl.classList.remove('on'); return; }

    const cw = stage.clientWidth;
    const ch = stage.clientHeight;
    const scale = Math.min(cw / vw, ch / vh);
    const dw = vw * scale, dh = vh * scale;
    const dx = (cw - dw) / 2, dy = (ch - dh) / 2;

    const r = getRegion(vw, vh);
    rectEl.style.left   = (dx + r.x * dw) + 'px';
    rectEl.style.top    = (dy + r.y * dh) + 'px';
    rectEl.style.width  = (r.w * dw) + 'px';
    rectEl.style.height = (r.h * dh) + 'px';
    rectEl.classList.add('on');
  }

  function flashRect(kind) {
    rectEl.classList.remove('hit');
    void rectEl.offsetWidth;
    rectEl.classList.add(kind);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => rectEl.classList.remove('hit'), 450);
  }

  // ---------------------------------------------------------- show value
  function show(text) {
    const now = Date.now();
    if (text === lastText && now - lastAt < DEDUPE_MS) return;
    lastText = text;
    lastAt = now;

    // Demasiado corto → probable falso positivo. Se ignora y se sigue
    // escaneando sin tocar la cámara ni la interfaz.
    if (typeof text !== 'string' || text.length < MIN_CODE_LENGTH) {
      log('Código demasiado corto, ignorado (' + text + ')', 'warn');
      return;
    }

    codeEl.textContent = text;
    codeEl.classList.add('hit');
    setTimeout(() => codeEl.classList.remove('hit'), 400);

    const parsed = parseGS1(text);
    showGS1(parsed);
    if (navigator.vibrate) navigator.vibrate(35);

    log('DECODIFICADO: ' + text.substring(0, 40) + (text.length > 40 ? '…' : ''), 'ok');

    if (parsed) lookupOFF(text);
    else { clearProduct(); lastLookupCode = ''; }

    // Cada detección válida detiene la cámara para que el usuario lea el
    // análisis. Toca de nuevo la pantalla para seguir escaneando.
    if (running) stop('Código detectado');
  }

  // ------------------------------------------------------- script loading
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { s.remove(); reject(new Error('No se pudo cargar ' + src)); };
      document.head.appendChild(s);
    });
  }

  async function loadZXing() {
    if (window.ZXing) return window.ZXing;
    let lastErr;
    for (const url of ZXING_URLS) {
      try {
        log('ZXing: cargando…');
        await loadScript(url);
        if (window.ZXing) { log('ZXing: cargado', 'ok'); return window.ZXing; }
      } catch (e) { lastErr = e; log('ZXing: fallo al cargar', 'warn'); }
    }
    throw lastErr || new Error('No se pudo cargar ZXing');
  }

  function setupZXingCore(ZX) {
    const hints = new Map();
    hints.set(ZX.DecodeHintType.TRY_HARDER, true);
    const formats = [];
    for (const name of BARCODE_FORMATS) {
      const key = name.toUpperCase().replace(/-/g, '_');
      if (ZX.BarcodeFormat[key] !== undefined) formats.push(ZX.BarcodeFormat[key]);
    }
    hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS, formats);
    const reader = new ZX.MultiFormatReader();
    reader.setHints(hints);
    log('ZXing listo (' + formats.length + ' formatos)', 'ok');
    return { Lib: ZX, reader };
  }

  function zxingDecode(canvas) {
    const src = new zxingCore.Lib.HTMLCanvasElementLuminanceSource(canvas);
    const binarizer = new zxingCore.Lib.HybridBinarizer(src);
    const bitmap = new zxingCore.Lib.BinaryBitmap(binarizer);
    return zxingCore.reader.decodeWithState(bitmap);
  }

  // ------------------------------------------------ camera acquisition
  async function acquireCamera() {
    const attempts = [
      { name: '1920x1080 trasera',
        v: { facingMode: { ideal: 'environment' },
             width:  { ideal: 1920 }, height: { ideal: 1080 },
             frameRate: { ideal: 30, max: 30 } } },
      { name: '1280x720 trasera',
        v: { facingMode: { ideal: 'environment' },
             width:  { ideal: 1280 }, height: { ideal: 720 },
             frameRate: { ideal: 30, max: 30 } } },
      { name: '1280x720 cualquiera',
        v: { width:  { ideal: 1280 }, height: { ideal: 720 } } },
      { name: '640x480 cualquiera',
        v: { width: { ideal: 640 }, height: { ideal: 480 } } },
      { name: 'por defecto', v: true }
    ];

    let lastErr;
    for (const a of attempts) {
      try {
        const s = await navigator.mediaDevices.getUserMedia({ audio: false, video: a.v });
        const track = s.getVideoTracks()[0];
        const st = (track && track.getSettings) ? track.getSettings() : {};
        log('Cámara ' + a.name + ' → ' + (st.width || '?') + '×' + (st.height || '?') +
            (st.frameRate ? ' @' + Math.round(st.frameRate) : ''), 'ok');
        return s;
      } catch (e) {
        lastErr = e;
        log('Cámara ' + a.name + ' falló: ' + (e.name || e.message || 'error'), 'warn');
      }
    }
    throw lastErr || new Error('No hay cámara disponible');
  }

  async function tryEnableContinuousFocus() {
    const track = stream && stream.getVideoTracks()[0];
    if (!track || typeof track.getCapabilities !== 'function') return;
    let caps = {};
    try { caps = track.getCapabilities(); } catch (_) {}
    if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) {
      try {
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        log('Autofoco continuo solicitado', 'ok');
      } catch (e) {
        log('Restricción de foco falló: ' + (e.message || e), 'warn');
      }
    }
  }

  function setupTorch() {
    torchTrack = null;
    torchOn = false;
    torchFab.hidden = true;
    torchFab.classList.remove('on');
    const track = stream && stream.getVideoTracks()[0];
    if (!track || typeof track.getCapabilities !== 'function') return;
    let caps = {};
    try { caps = track.getCapabilities(); } catch (_) {}
    if (caps.torch) {
      torchTrack = track;
      torchFab.hidden = false;
    }
  }

  async function toggleTorch() {
    if (!torchTrack) return;
    const next = !torchOn;
    try {
      await torchTrack.applyConstraints({ advanced: [{ torch: next }] });
      torchOn = next;
      torchFab.classList.toggle('on', torchOn);
    } catch (e) {
      log('Fallo al cambiar la linterna: ' + (e.message || e), 'warn');
    }
  }

  // ------------------------------------------------- crop + rotation
  function getCropRectPx(vw, vh) {
    const r = getRegion(vw, vh);
    let x = r.x * vw, y = r.y * vh, w = r.w * vw, h = r.h * vh;
    const padX = w * CROP_PADDING, padY = h * CROP_PADDING;
    x = Math.max(0, x - padX);
    y = Math.max(0, y - padY);
    w = Math.min(vw - x, w + 2 * padX);
    h = Math.min(vh - y, h + 2 * padY);
    return { x, y, w, h };
  }

  function makeCropCanvas() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    const rect = getCropRectPx(vw, vh);
    let scale = 1;
    const maxDim = Math.max(rect.w, rect.h);
    if (maxDim > CROP_MAX_DIM) scale = CROP_MAX_DIM / maxDim;
    const cw = Math.max(1, Math.round(rect.w * scale));
    const ch = Math.max(1, Math.round(rect.h * scale));
    if (cropCanvas.width !== cw || cropCanvas.height !== ch) {
      cropCanvas.width = cw;
      cropCanvas.height = ch;
    }
    cropCtx.drawImage(video, rect.x, rect.y, rect.w, rect.h, 0, 0, cw, ch);
    return cropCanvas;
  }

  function rotatedCanvas(src, deg) {
    const swap = deg === 90 || deg === 270;
    const w = swap ? src.height : src.width;
    const h = swap ? src.width : src.height;
    if (rotCanvas.width !== w || rotCanvas.height !== h) {
      rotCanvas.width = w;
      rotCanvas.height = h;
    }
    rotCtx.save();
    rotCtx.clearRect(0, 0, w, h);
    rotCtx.translate(w / 2, h / 2);
    rotCtx.rotate(deg * Math.PI / 180);
    rotCtx.drawImage(src, -src.width / 2, -src.height / 2);
    rotCtx.restore();
    return rotCanvas;
  }

  // ------------------------------------------------------- decoding
  async function tryDecode(canvas) {
    if (nativeDetector) {
      try {
        const codes = await nativeDetector.detect(canvas);
        if (codes && codes.length) {
          const hit = codes.find(c => c && c.rawValue);
          if (hit) { flashRect('hit'); show(hit.rawValue); return true; }
        }
      } catch (e) {
        logThrottled('Error del detector nativo: ' + (e.message || e), 'err');
      }
    }
    if (zxingCore) {
      try {
        const result = zxingDecode(canvas);
        if (result) { flashRect('hit'); show(result.getText()); return true; }
      } catch (e) {
        // NotFoundException / ChecksumException / FormatException:
        // nada decodificado — lo esperado la mayoría de las veces.
      }
    }
    return false;
  }

  async function detectTick() {
    const base = makeCropCanvas();
    if (!base) return;

    if (await tryDecode(base)) return;

    const angle = EXTRA_ROTATIONS[rotCursor % EXTRA_ROTATIONS.length];
    rotCursor++;
    const rotated = rotatedCanvas(base, angle);
    await tryDecode(rotated);
  }

  function scheduleTick(cb) {
    if (video.requestVideoFrameCallback) {
      rvfcHandle = video.requestVideoFrameCallback(() => cb());
    } else {
      rafId = requestAnimationFrame(cb);
    }
  }

  function runLoop() {
    if (!running) return;
    const now = performance.now();
    if (!busy && now - lastTick >= DETECT_INTERVAL) {
      lastTick = now;
      busy = true;
      detectTick()
        .catch(e => logThrottled('Error de detección: ' + (e.message || e), 'err'))
        .finally(() => { busy = false; });
    }
    scheduleTick(runLoop);
  }

  function waitForVideoSize() {
    return new Promise((resolve) => {
      if (video.videoWidth && video.videoHeight) { updateOverlay(); return resolve(); }
      let tries = 0;
      const tick = () => {
        if (video.videoWidth && video.videoHeight) { updateOverlay(); resolve(); }
        else if (tries++ < 40) setTimeout(tick, 50);
        else resolve();
      };
      tick();
    });
  }

  // ------------------------------------------------------------- lifecycle
  async function start() {
    if (running) return;
    running = true;

    // Ocultar el toast mientras se escanea
    clearTimeout(toastTimer);
    toastEl.classList.remove('on');
    tapCatch.classList.add('off');
    fabsEl.hidden = false;

    codeEl.textContent = '—';
    gs1El.textContent = '';
    clearProduct();
    lastText = '';
    lastLookupCode = '';
    log('--- inicio ---');
    setStatus('Iniciando cámara…');

    try {
      stream = await acquireCamera();
      video.srcObject = stream;
      await video.play();
      await waitForVideoSize();
    } catch (err) {
      const m = err && err.message ? err.message : String(err);
      log('Fallo de cámara: ' + m, 'err');
      setStatus('Error: ' + m);
      stop('Error de cámara');
      return;
    }

    await tryEnableContinuousFocus();
    setupTorch();

    if ('BarcodeDetector' in window) {
      try {
        let formats = BARCODE_FORMATS;
        if (typeof BarcodeDetector.getSupportedFormats === 'function') {
          const supported = await BarcodeDetector.getSupportedFormats();
          const filtered = BARCODE_FORMATS.filter(f => supported.indexOf(f) !== -1);
          if (filtered.length) formats = filtered;
        }
        nativeDetector = new BarcodeDetector({ formats });
        log('Detector nativo listo (' + formats.length + ' formatos)', 'ok');
      } catch (e) {
        nativeDetector = null;
        log('Inicio del detector nativo falló: ' + (e.message || e), 'warn');
      }
    } else {
      log('Detector nativo no disponible (esperado en iOS Safari)', 'warn');
    }

    setStatus(nativeDetector ? 'Escaneando · nativo' : 'Cargando decodificador…');

    loadZXing().then((ZX) => {
      if (!running) return;
      zxingCore = setupZXingCore(ZX);
      if (!nativeDetector) setStatus('Escaneando · ZXing');
    }).catch((e) => {
      log('ZXing no cargó: ' + (e.message || e), nativeDetector ? 'warn' : 'err');
      if (!nativeDetector) {
        setStatus('Error: no hay decodificador disponible');
        stop('Sin decodificador');
      }
    });

    runLoop();
  }

  function stop(reason) {
    running = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    if (rvfcHandle && video.cancelVideoFrameCallback) {
      try { video.cancelVideoFrameCallback(rvfcHandle); } catch (_) {}
      rvfcHandle = 0;
    }
    busy = false;
    nativeDetector = null;
    zxingCore = null;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    try { video.pause(); } catch (_) {}
    video.srcObject = null;
    torchTrack = null;
    torchOn = false;
    torchFab.hidden = true;
    torchFab.classList.remove('on');
    fabsEl.hidden = true;
    rectEl.classList.remove('on', 'hit');
    tapCatch.classList.remove('off');

    setStatus(reason || 'Detenido');
    log(reason ? '--- detenido: ' + reason + ' ---' : '--- detenido ---');

    // Aviso de 3 s: toca la pantalla para volver a escanear.
    showToast('Toca la pantalla para escanear', TOAST_MS);
  }

  // ------------------------------------------------------------- wiring
  tapCatch.addEventListener('click', (e) => {
    e.preventDefault();
    if (!running) start();
  });

  stopFab.addEventListener('click', (e) => {
    e.stopPropagation();
    if (running) stop('Detenido manualmente');
  });

  torchFab.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleTorch();
  });

  window.addEventListener('resize', updateOverlay);
  window.addEventListener('orientationchange', () => setTimeout(updateOverlay, 200));
  video.addEventListener('loadedmetadata', updateOverlay);

  window.addEventListener('pagehide', () => {
    if (running) {
      // Parada silenciosa al abandonar la página (sin toast).
      running = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      if (rvfcHandle && video.cancelVideoFrameCallback) {
        try { video.cancelVideoFrameCallback(rvfcHandle); } catch (_) {}
        rvfcHandle = 0;
      }
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      try { video.pause(); } catch (_) {}
      video.srcObject = null;
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && running) stop('Pausado');
  });

  // Toast inicial: indica al usuario que debe tocar la pantalla.
  showToast('Toca la pantalla para escanear', TOAST_MS);
})();
</script>
</body>
</html>
