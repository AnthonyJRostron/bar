<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Barcode Scanner</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #000; color: #fff;
    font: 16px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; overflow: hidden;
  }

  #stage { position: relative; flex: 1 1 auto; min-height: 0; background: #000; overflow: hidden; }

  #video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; display: block; background: #000; z-index: 0;
  }

  #overlay { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  #rect {
    position: absolute;
    border: 2px solid rgba(255,255,255,0.85);
    border-radius: 14px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
    transition: border-color .15s ease, box-shadow .15s ease;
    opacity: 0;
  }
  #rect.on  { opacity: 1; }
  #rect.hit {
    border-color: #6ee7a8;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.45), 0 0 22px rgba(110,231,168,0.75);
  }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: calc(10px + env(safe-area-inset-top)) 12px 0;
    z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none;
  }

  #status {
    font-size: 12px; color: #9aa0a6; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,0.95);
  }

  #logWrap {
    width: 100%; max-width: 460px;
    background: rgba(0,0,0,0.72);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 6px 10px;
    pointer-events: auto;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #log {
    margin: 0; font-family: ui-monospace, monospace;
    font-size: 10.5px; line-height: 1.45; color: #b8bcc2;
    white-space: pre-wrap; word-break: break-word;
    max-height: 62px; overflow: hidden;
  }
  #log .err { color: #ef9a9a; }
  #log .ok  { color: #6ee7a8; }
  #log .warn{ color: #fbbf24; }

  #panel {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 24px 16px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.92) 35%);
    max-height: 62%; overflow-y: auto; -webkit-overflow-scrolling: touch;
    z-index: 2;
  }

  #code {
    font-size: clamp(20px, 7vw, 38px); font-weight: 700;
    line-height: 1.15; text-align: center; word-break: break-all;
    transition: color .12s ease;
  }
  #code.hit { color: #6ee7a8; }

  #gs1 {
    margin-top: 8px; font-size: 13px; color: #9aa0a6;
    text-align: center; line-height: 1.6;
  }

  #product {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid #2a2a2e;
    font-size: 14px; line-height: 1.5; color: #d0d0d5; display: none;
  }
  #product.visible { display: block; }
  #product .name { font-size: 18px; font-weight: 700; color: #fff; text-align: center; }
  #product .brand { color: #9aa0a6; text-align: center; }
  #product .meta { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  #product .badge { padding: 3px 8px; border-radius: 6px; background: #1c1c1f; font-size: 12px; color: #ccc; }
  #product .badge.grade-a { background: #0f5132; color: #6ee7a8; }
  #product .badge.grade-b { background: #3d5a00; color: #d4e157; }
  #product .badge.grade-c { background: #6d5200; color: #ffd54f; }
  #product .badge.grade-d { background: #7a2e00; color: #ffab91; }
  #product .badge.grade-e { background: #6b1c1c; color: #ef9a9a; }

  #ingredients {
    margin-top: 10px; font-size: 12px; color: #9aa0a6; line-height: 1.5;
    display: none;
  }
  #ingredients.visible { display: block; }
  #ingredients b { color: #d0d0d5; font-weight: 700; display: block; margin-bottom: 3px; }

  #lookupLink {
    display: block; margin-top: 16px; text-align: center;
    padding: 13px 16px; border-radius: 10px;
    background: #1f6feb; color: #fff; text-decoration: none;
    font-weight: 600; font-size: 14px;
  }
  #lookupLink[hidden] { display: none; }

  #bar {
    flex: 0 0 auto; display: flex; gap: 10px;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    background: #0b0b0c; border-top: 1px solid #1c1c1f;
  }
  #bar button {
    flex: 1; padding: 15px 12px; font: inherit; font-size: 16px; font-weight: 600;
    color: #fff; background: #1f6feb; border: 0; border-radius: 12px; cursor: pointer;
  }
  #bar button:disabled { background: #232326; color: #6b6b70; cursor: default; }
  #torch { flex: 0 0 auto; min-width: 64px; background: #232326; }
  #torch.on { background: #fbbf24; color: #1a1a1a; }
  #torch[hidden] { display: none; }

  /* ===================== PATIENT PROFILE ===================== */
  #profileCard {
    margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px;
    background: rgba(18,18,22,0.88);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    overflow: hidden;
  }
  #profileToggle {
    width: 100%;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px;
    background: transparent; border: 0; color: #fff;
    font: inherit; font-size: 13.5px; font-weight: 700;
    cursor: pointer; text-align: left;
  }
  #profileToggle .ptitle { flex: 0 0 auto; }
  #profileSummary {
    margin-left: auto; color: #9aa0a6; font-weight: 400; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48%;
  }
  #profileToggle .chev { color: #9aa0a6; transition: transform .2s; flex: 0 0 auto; }
  #profileCard.open #profileToggle .chev { transform: rotate(180deg); }

  #profileBody { display: none; padding: 0 14px 14px; }
  #profileCard.open #profileBody { display: block; }

  .field-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .field { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label {
    font-size: 10.5px; color: #9aa0a6;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .field input, .field select {
    width: 100%; padding: 9px 10px; font: inherit; font-size: 14px;
    background: #0d0d11; color: #fff;
    border: 1px solid #2a2a2e; border-radius: 8px;
  }
  .field input:focus, .field select:focus { outline: none; border-color: #1f6feb; }

  .cond-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 6px;
    margin-top: 6px;
  }
  .cond {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 10px; border-radius: 9px;
    background: #0d0d11; border: 1px solid #232326;
    font-size: 12.5px; cursor: pointer; user-select: none;
    transition: background .12s, border-color .12s;
    line-height: 1.25;
  }
  .cond input { display: none; }
  .cond .tick {
    width: 18px; height: 18px; border-radius: 5px; flex: 0 0 auto;
    border: 2px solid #3a3a40;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: transparent;
    transition: all .12s;
  }
  .cond.on { background: #14223c; border-color: #1f6feb; }
  .cond.on .tick { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .cond .ico { font-size: 15px; flex: 0 0 auto; }

  .profile-note { font-size: 11px; color: #6b6b70; margin-top: 12px; text-align: center; }

  /* ===================== ANALYSIS ===================== */
  #analysis { display: none; }
  #analysis.visible { display: block; }

  .score-wrap {
    display: flex; align-items: center; gap: 14px;
    margin: 14px 0 4px;
  }
  .score-circle {
    width: 68px; height: 68px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 23px; font-weight: 800; color: #fff;
    background: var(--c, #444);
    box-shadow: 0 0 0 4px rgba(255,255,255,0.05), 0 0 22px -6px var(--c, #444);
    font-variant-numeric: tabular-nums;
  }
  .score-meta { flex: 1; min-width: 0; }
  .score-title { font-size: 14px; font-weight: 800; letter-spacing: .3px; }
  .score-sub { font-size: 11.5px; color: #9aa0a6; margin-top: 3px; }

  .tl-title {
    font-size: 10.5px; color: #9aa0a6; text-transform: uppercase;
    letter-spacing: .7px; margin: 16px 0 6px; font-weight: 700;
  }
  .tl-row { display: flex; align-items: center; gap: 9px; padding: 4px 0; }
  .tl-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .tl-name { flex: 0 0 86px; font-size: 12.5px; color: #d0d0d5; }
  .tl-bar {
    flex: 1 1 auto; height: 8px; border-radius: 4px;
    background: #202024; overflow: hidden;
  }
  .tl-fill { display: block; height: 100%; border-radius: 4px; transition: width .25s ease; }
  .tl-val {
    flex: 0 0 auto; font-size: 11.5px; color: #b8bcc2;
    font-variant-numeric: tabular-nums; min-width: 62px; text-align: right;
  }

  .cond-list { display: flex; flex-direction: column; gap: 8px; }
  .cond-card {
    padding: 10px 12px; border-radius: 10px;
    background: #121218; border-left: 4px solid #444;
  }
  .cond-card.good { border-left-color: #22c55e; }
  .cond-card.warn { border-left-color: #fbbf24; }
  .cond-card.bad  { border-left-color: #ef4444; }
  .cond-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700;
  }
  .cond-head .ico { font-size: 15px; }
  .cond-score {
    margin-left: auto; font-size: 13.5px;
    font-variant-numeric: tabular-nums; font-weight: 800;
  }
  .cond-note {
    font-size: 11.5px; color: #9aa0a6; margin-top: 5px; line-height: 1.5;
  }
</style>
</head>
<body>

  <div id="stage">
    <video id="video" playsinline webkit-playsinline muted autoplay></video>
    <div id="overlay"><div id="rect"></div></div>

    <div id="topbar">
      <div id="status">Tap Start to scan</div>
      <div id="logWrap"><pre id="log">ready.</pre></div>
    </div>

    <div id="panel">

      <div id="profileCard">
        <button id="profileToggle" type="button">
          <span class="ico">👤</span>
          <span class="ptitle">Patient Profile</span>
          <span id="profileSummary">not set</span>
          <span class="chev">▾</span>
        </button>
        <div id="profileBody">
          <div class="field-row">
            <div class="field">
              <label for="pAge">Age</label>
              <input id="pAge" type="number" min="0" max="120" inputmode="numeric" placeholder="—">
            </div>
            <div class="field">
              <label for="pSex">Sex</label>
              <select id="pSex">
                <option value="">—</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="field">
              <label for="pWeight">Weight kg</label>
              <input id="pWeight" type="number" min="0" max="400" inputmode="decimal" placeholder="—">
            </div>
          </div>

          <div class="tl-title" style="margin-top:0">Health conditions</div>
          <div class="cond-grid" id="condGrid"></div>

          <div class="profile-note">Saved on this device only · not medical advice</div>
        </div>
      </div>

      <div id="code">—</div>
      <div id="gs1"></div>
      <div id="product">
        <div class="name"></div>
        <div class="brand"></div>
        <div class="meta"></div>
        <div id="ingredients"></div>
        <div id="analysis"></div>
      </div>
      <a id="lookupLink" href="#" target="_blank" rel="noopener noreferrer" hidden>View on Barcode Lookup ↗</a>
    </div>
  </div>

  <div id="bar">
    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
    <button id="torch" hidden>Torch</button>
  </div>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------- refs
  const video     = document.getElementById('video');
  const stage     = document.getElementById('stage');
  const rectEl    = document.getElementById('rect');
  const codeEl    = document.getElementById('code');
  const gs1El     = document.getElementById('gs1');
  const productEl = document.getElementById('product');
  const nameEl    = productEl.querySelector('.name');
  const brandEl   = productEl.querySelector('.brand');
  const metaEl    = productEl.querySelector('.meta');
  const ingredientsEl = document.getElementById('ingredients');
  const analysisEl    = document.getElementById('analysis');
  const lookupLinkEl = document.getElementById('lookupLink');
  const statusEl  = document.getElementById('status');
  const logEl     = document.getElementById('log');
  const startBtn  = document.getElementById('start');
  const stopBtn   = document.getElementById('stop');
  const torchBtn  = document.getElementById('torch');

  // ------------------------------------------------------------- constants
  // 1D barcode formats only — QR/2D support has been removed entirely.
  const BARCODE_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e',
                            'code_128', 'code_39', 'code_93', 'itf', 'codabar'];

  // We crop just the viewfinder region out of the video at (near-)native
  // resolution and decode that crop — not the whole downscaled frame. This
  // is what makes "code is in the box but isn't detected" go away: the
  // barcode becomes the dominant subject of a full-resolution image
  // instead of a small blurry patch of a shrunk one.
  const CROP_MAX_DIM  = 1400;
  const CROP_PADDING  = 0.08; // extra margin around the viewfinder box

  const OFF_BASE = 'https://world.openfoodfacts.org/api/v2/product/';
  const BARCODE_LOOKUP_BASE = 'https://www.barcodelookup.com/';
  const CORS_PROXIES = [
    { name: 'corsproxy.io',  build: (u) => 'https://corsproxy.io/?url=' + encodeURIComponent(u) },
    { name: 'allorigins',    build: (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) },
    { name: 'thingproxy',    build: (u) => 'https://thingproxy.freeboard.io/fetch/' + u }
  ];

  const ZXING_URLS = [
    'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js',
    'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js'
  ];

  const GS1_PREFIXES = {
    '000':'US/Canada','001':'US/Canada','002':'US/Canada','003':'US/Canada',
    '004':'US/Canada','005':'US/Canada','006':'US/Canada','007':'US/Canada',
    '008':'US/Canada','009':'US/Canada','010':'US/Canada','011':'US/Canada',
    '012':'US/Canada','013':'US/Canada','014':'US/Canada','015':'US/Canada',
    '016':'US/Canada','017':'US/Canada','018':'US/Canada','019':'US/Canada',
    '020':'US/Canada (restricted)','029':'US/Canada (restricted)',
    '030':'US (GS1 US)','036':'US (GS1 US)','037':'US (GS1 US)',
    '038':'US (GS1 US)','039':'US (GS1 US)','040':'US (GS1 US)',
    '050':'US (GS1 US)','060':'US (GS1 US)','070':'US (GS1 US)',
    '080':'US (GS1 US)','090':'US (GS1 US)','100':'US (GS1 US)',
    '110':'US (GS1 US)','120':'US (GS1 US)','130':'US (GS1 US)',
    '200':'Restricted distribution',
    '300':'France','310':'France','320':'France','330':'France','340':'France',
    '350':'France','360':'France','370':'France','380':'Bulgaria',
    '400':'Germany','410':'Germany','420':'Germany','430':'Germany','440':'Germany',
    '450':'Japan','460':'Russia','470':'Kyrgyzstan','480':'Philippines','490':'Japan',
    '500':'UK','509':'UK',
    '520':'Greece','530':'Cyprus','540':'Belgium/Luxembourg',
    '560':'Portugal','570':'Denmark','590':'Poland',
    '600':'South Africa','610':'Mauritius','620':'Tanzania',
    '640':'Finland','690':'China','693':'China','694':'China',
    '700':'Norway','729':'Israel','740':'Guatemala',
    '750':'Mexico','760':'Switzerland','770':'Colombia',
    '775':'Peru','779':'Argentina','780':'Chile',
    '789':'Brazil','790':'Brazil',
    '800':'Italy','810':'Italy','820':'Italy','830':'Italy',
    '840':'Spain','850':'Cuba','858':'Slovakia',
    '860':'Serbia','869':'Turkey','870':'Netherlands',
    '880':'South Korea','885':'Thailand','888':'Singapore',
    '890':'India','893':'Vietnam','899':'Indonesia',
    '900':'Austria','910':'Austria','920':'Austria',
    '930':'Australia','940':'New Zealand','950':'Taiwan',
    '955':'Malaysia','958':'Macau'
  };

  const DETECT_INTERVAL      = 100;
  const DEDUPE_MS            = 1500;
  const LOG_MAX              = 5;
  const DETECT_LOG_THROTTLE  = 500;

  // Cardinal rotations. 0deg every tick (fast path); one more angle is
  // round-robined in each tick so a sideways or upside-down barcode is
  // caught within a few tenths of a second.
  const EXTRA_ROTATIONS = [90, 180, 270];

  // ---------------------------------------------------------------- state
  let running         = false;
  let rafId           = 0;
  let rvfcHandle      = 0;
  let busy            = false;
  let lastTick        = 0;
  let stream          = null;
  let nativeDetector  = null;
  let zxingCore       = null; // { Lib, reader } once loaded and configured
  let torchTrack      = null;
  let torchOn         = false;
  let rotCursor       = 0;
  let lastText        = '';
  let lastAt          = 0;
  let lastLookupCode  = '';
  let lookupId        = 0;
  let flashTimer      = 0;
  let lastDetectLog   = 0;
  let lastProductData = null; // last Open Food Facts product payload

  // canvases used for the crop + rotation pipeline (created once)
  const cropCanvas = document.createElement('canvas');
  cropCanvas.style.display = 'none';
  document.body.appendChild(cropCanvas);
  const cropCtx = cropCanvas.getContext('2d', { willReadFrequently: true });

  const rotCanvas = document.createElement('canvas');
  rotCanvas.style.display = 'none';
  document.body.appendChild(rotCanvas);
  const rotCtx = rotCanvas.getContext('2d', { willReadFrequently: true });

  // ---------------------------------------------------------------- log
  const logLines = [];
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function log(msg, cls) {
    const t = new Date().toLocaleTimeString('en-GB', { hour12: false });
    const line = '[' + t + '] ' + msg;
    logLines.push(cls ? '<span class="' + cls + '">' + escapeHtml(line) + '</span>' : escapeHtml(line));
    while (logLines.length > LOG_MAX) logLines.shift();
    logEl.innerHTML = logLines.join('\n');
  }
  function logThrottled(msg, cls) {
    const now = Date.now();
    if (now - lastDetectLog < DETECT_LOG_THROTTLE) return;
    lastDetectLog = now;
    log(msg, cls);
  }

  function setStatus(t) { statusEl.textContent = t; }

  function clearProduct() {
    productEl.classList.remove('visible');
    nameEl.textContent = '';
    brandEl.textContent = '';
    metaEl.innerHTML = '';
    ingredientsEl.textContent = '';
    ingredientsEl.classList.remove('visible');
    analysisEl.innerHTML = '';
    analysisEl.classList.remove('visible');
    lastProductData = null;
  }

  // ------------------------------------------------------------ GS1 parse
  function parseGS1(raw) {
    const code = String(raw).replace(/\D/g, '');
    if (code.length !== 12 && code.length !== 13) return null;

    const full         = code.length === 12 ? '0' + code : code;
    const prefix       = full.substring(0, 3);
    const manufacturer = full.substring(3, 8);
    const productCode  = full.substring(8, 12);
    const checkDigit   = full.substring(12, 13);

    let sum = 0;
    for (let i = 0; i < 12; i++) sum += Number(full[i]) * (i % 2 === 0 ? 1 : 3);
    const calc  = (10 - (sum % 10)) % 10;
    const valid = calc === Number(checkDigit);

    let country = GS1_PREFIXES[prefix] || GS1_PREFIXES[prefix.substring(0, 2)] || null;

    return {
      full,
      format: code.length === 12 ? 'UPC-A' : 'EAN-13',
      prefix, manufacturer, productCode, checkDigit, valid,
      country: country || 'Unknown / see GS1 prefix list'
    };
  }

  function showGS1(parsed) {
    if (!parsed) { gs1El.textContent = ''; return; }
    gs1El.innerHTML =
      parsed.format + ' · ' + (parsed.valid ? 'check digit OK' : 'check digit FAILED') + '<br>' +
      'Region: ' + parsed.country +
      ' · Mfr: ' + parsed.manufacturer +
      ' · Product: ' + parsed.productCode;
  }

  // ------------------------------------------------------ Open Food Facts
  async function fetchWithProxies(url) {
    log('OFF: direct fetch…');
    try {
      const r = await fetch(url, { headers: { 'User-Agent': 'BarcodeScanner/1.0' }, mode: 'cors' });
      if (r.ok) { log('OFF: direct OK', 'ok'); return r; }
      log('OFF: direct HTTP ' + r.status, 'warn');
    } catch (e) {
      const m = e && e.message ? e.message : 'CORS/network';
      log('OFF: direct blocked — ' + m, 'warn');
    }
    for (const p of CORS_PROXIES) {
      log('OFF: via ' + p.name + '…');
      try {
        const r = await fetch(p.build(url));
        if (r.ok) { log('OFF: ' + p.name + ' OK', 'ok'); return r; }
        log('OFF: ' + p.name + ' HTTP ' + r.status, 'warn');
      } catch (e) {
        const m = e && e.message ? e.message : 'failed';
        log('OFF: ' + p.name + ' — ' + m, 'warn');
      }
    }
    throw new Error('All fetch attempts failed (CORS or network)');
  }

  function gradeClass(grade) {
    if (!grade) return '';
    const g = String(grade).toLowerCase();
    return 'abcde'.indexOf(g) !== -1 ? 'grade-' + g : '';
  }

  function renderProduct(p) {
    if (!p) { clearProduct(); return; }
    lastProductData = p;

    nameEl.textContent = p.product_name || '(no name)';
    brandEl.textContent = [p.brands, p.quantity].filter(Boolean).join(' · ');
    metaEl.innerHTML = '';
    if (p.nutrition_grades) {
      const b = document.createElement('span');
      b.className = 'badge ' + gradeClass(p.nutrition_grades);
      b.textContent = 'Nutri-Score ' + p.nutrition_grades.toUpperCase();
      metaEl.appendChild(b);
    }
    if (p.nova_group) {
      const b = document.createElement('span');
      b.className = 'badge';
      b.textContent = 'NOVA ' + p.nova_group;
      metaEl.appendChild(b);
    }

    if (p.ingredients_text) {
      ingredientsEl.innerHTML = '<b>Ingredients</b>' + escapeHtml(p.ingredients_text);
      ingredientsEl.classList.add('visible');
    } else {
      ingredientsEl.textContent = '';
      ingredientsEl.classList.remove('visible');
    }

    productEl.classList.add('visible');
    renderAnalysis();
  }

  async function lookupOFF(barcode) {
    const digits = String(barcode).replace(/\D/g, '');
    if (digits.length !== 8 && digits.length !== 12 && digits.length !== 13) return;
    if (digits === lastLookupCode) return;
    lastLookupCode = digits;

    const id = ++lookupId;
    clearProduct();
    setStatus('Looking up product…');
    log('OFF lookup: ' + digits);

    try {
      const url = OFF_BASE + encodeURIComponent(digits) +
        '?fields=product_name,brands,quantity,nutrition_grades,nova_group,' +
        'nutriments,ingredients_text,allergens_tags,additives_tags,categories_tags';
      const res = await fetchWithProxies(url);
      if (id !== lookupId) return;
      if (!res.ok) {
        log('OFF: HTTP ' + res.status, 'err');
        setStatus('OFF HTTP ' + res.status);
        return;
      }
      const data = await res.json();
      if (id !== lookupId) return;
      if (data.status !== 1 || !data.product) {
        log('OFF: not found', 'warn');
        setStatus('Not found in Open Food Facts');
        return;
      }
      renderProduct(data.product);
      log('OFF: found "' + (data.product.product_name || '') + '"', 'ok');
      setStatus('Found in Open Food Facts');
    } catch (err) {
      if (id !== lookupId) return;
      const m = err && err.message ? err.message : String(err);
      log('OFF: ' + m, 'err');
      setStatus('OFF lookup failed');
    }
  }

  // ============================================================
  // ==============  PATIENT PROFILE + HEALTH SCORING  ==========
  // ============================================================

  const PROFILE_KEY = 'barcodeScanner.patient.v1';

  const CONDITIONS = [
    { id: 'diabetes',    label: 'Type 2 Diabetes',        icon: '🩸' },
    { id: 'hbp',         label: 'High Blood Pressure',    icon: '❤️' },
    { id: 'cholesterol', label: 'High Cholesterol',       icon: '🫀' },
    { id: 'ckd',         label: 'Kidney Disease',         icon: '🫘' },
    { id: 'obesity',     label: 'Weight Management',      icon: '⚖️' },
    { id: 'gout',        label: 'Gout',                   icon: '🦴' },
    { id: 'ibs',         label: 'IBS / Gut Sensitivity',  icon: '🌀' },
    { id: 'celiac',      label: 'Coeliac (Gluten)',       icon: '🌾' },
    { id: 'lactose',     label: 'Lactose Intolerance',    icon: '🥛' },
    { id: 'nutallergy',  label: 'Nut Allergy',            icon: '🥜' },
    { id: 'pregnancy',   label: 'Pregnancy',              icon: '🤰' }
  ];

  const NUTRIENT_LABELS = {
    energy: 'Calories', fat: 'Fat', saturated: 'Saturated fat',
    sugars: 'Sugars', salt: 'Salt', carbohydrates: 'Carbs',
    fiber: 'Fibre', proteins: 'Protein'
  };

  // UK FSA / NHS front-of-pack "traffic light" thresholds, per 100 g.
  const TL = {
    fat:       { green: 3.0, red: 17.5, label: 'Fat' },
    saturated: { green: 1.5, red: 5.0,  label: 'Saturated fat' },
    sugars:    { green: 5.0, red: 22.5, label: 'Sugars' },
    salt:      { green: 0.3, red: 1.5,  label: 'Salt' }
  };

  // Which nutrients matter for which condition, and how much.
  const CONDITION_RULES = {
    diabetes:    { nutrients: { sugars: 3, carbohydrates: 1.5, fiber: 2 } },
    hbp:         { nutrients: { salt: 4, saturated: 1 } },
    cholesterol: { nutrients: { saturated: 3, fat: 1.5, fiber: 2 } },
    ckd:         { nutrients: { salt: 4, proteins: 1.5 } },
    obesity:     { nutrients: { energy: 2, sugars: 2, saturated: 2, fiber: 1.5 } },
    gout:        { nutrients: { sugars: 2, proteins: 1.5, energy: 1 } },
    ibs:         { nutrients: { fat: 1.5, sugars: 1.5, fiber: 1 } },
    pregnancy:   { nutrients: { salt: 1, sugars: 1.5, saturated: 1.5, proteins: 1 } },
    celiac:      { allergen: 'gluten' },
    lactose:     { allergen: 'milk' },
    nutallergy:  { allergen: 'nuts' }
  };

  const DEFAULT_PROFILE = { age: '', sex: '', weight: '', conditions: {} };

  function loadProfile() {
    try {
      const raw = localStorage.getItem(PROFILE_KEY);
      if (!raw) return JSON.parse(JSON.stringify(DEFAULT_PROFILE));
      const p = JSON.parse(raw);
      return {
        age: p && p.age != null ? p.age : '',
        sex: p && p.sex != null ? p.sex : '',
        weight: p && p.weight != null ? p.weight : '',
        conditions: (p && p.conditions && typeof p.conditions === 'object') ? p.conditions : {}
      };
    } catch (_) {
      return JSON.parse(JSON.stringify(DEFAULT_PROFILE));
    }
  }

  function saveProfile() {
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); }
    catch (e) { log('Profile save failed: ' + (e.message || e), 'warn'); }
  }

  let profile = loadProfile();

  const profileCard    = document.getElementById('profileCard');
  const profileToggle  = document.getElementById('profileToggle');
  const profileSummary = document.getElementById('profileSummary');
  const condGrid       = document.getElementById('condGrid');
  const pAge           = document.getElementById('pAge');
  const pSex           = document.getElementById('pSex');
  const pWeight        = document.getElementById('pWeight');

  function updateProfileSummary() {
    const ids = Object.keys(profile.conditions).filter(k => profile.conditions[k]);
    const bits = [];
    if (profile.age) bits.push(profile.age + 'y');
    if (profile.sex) bits.push(profile.sex === 'male' ? 'M' : profile.sex === 'female' ? 'F' : 'O');
    if (ids.length) {
      bits.push(ids.map(id => {
        const c = CONDITIONS.find(x => x.id === id);
        return c ? c.icon : '';
      }).join(''));
    }
    profileSummary.textContent = bits.length ? bits.join(' · ') : 'not set';
  }

  function buildConditionGrid() {
    condGrid.innerHTML = '';
    for (const c of CONDITIONS) {
      const checked = !!profile.conditions[c.id];
      const lab = document.createElement('label');
      lab.className = 'cond' + (checked ? ' on' : '');
      lab.dataset.id = c.id;
      lab.innerHTML =
        '<input type="checkbox"' + (checked ? ' checked' : '') + '>' +
        '<span class="tick">✓</span>' +
        '<span class="ico">' + c.icon + '</span>' +
        '<span class="lbl">' + c.label + '</span>';
      const cb = lab.querySelector('input');
      cb.addEventListener('change', () => {
        profile.conditions[c.id] = cb.checked;
        lab.classList.toggle('on', cb.checked);
        saveProfile();
        updateProfileSummary();
        renderAnalysis();
      });
      condGrid.appendChild(lab);
    }
  }

  profileToggle.addEventListener('click', () => {
    profileCard.classList.toggle('open');
  });

  pAge.addEventListener('input', () => {
    profile.age = pAge.value; saveProfile(); updateProfileSummary(); renderAnalysis();
  });
  pSex.addEventListener('change', () => {
    profile.sex = pSex.value; saveProfile(); updateProfileSummary(); renderAnalysis();
  });
  pWeight.addEventListener('input', () => {
    profile.weight = pWeight.value; saveProfile(); updateProfileSummary();
  });

  pAge.value = profile.age;
  pSex.value = profile.sex;
  pWeight.value = profile.weight;
  buildConditionGrid();
  updateProfileSummary();

  // ------------------------- nutrient extraction -------------------------

  function pick() {
    for (let i = 0; i < arguments.length; i++) {
      if (arguments[i] != null) return arguments[i];
    }
    return null;
  }

  function numOr(v) {
    if (v === '' || v == null) return null;
    const n = Number(v);
    return isFinite(n) ? n : null;
  }

  function extractNutrients(p) {
    const nu = (p && p.nutriments) || {};
    const sodium = numOr(nu.sodium_100g);
    const salt   = pick(numOr(nu.salt_100g), sodium != null ? sodium * 2.5 : null);
    const kcal   = numOr(nu['energy-kcal_100g']);
    const kj     = numOr(nu.energy_100g);
    const energy = pick(kcal, kj != null ? kj / 4.184 : null);
    return {
      energy:        energy,
      fat:           numOr(nu.fat_100g),
      saturated:     numOr(nu['saturated-fat_100g']),
      carbohydrates: numOr(nu.carbohydrates_100g),
      sugars:        numOr(nu.sugars_100g),
      fiber:         numOr(nu.fiber_100g),
      proteins:      numOr(nu.proteins_100g),
      salt:          salt
    };
  }

  // ------------------------- scoring primitives -------------------------

  function bandScore(value, green, red) {
    if (value == null) return null;
    if (value <= 0) return 10;
    if (value <= green) return 10 - 2 * (value / green);                  // 8..10
    if (value <= red)   return 8 - 4 * ((value - green) / (red - green)); // 4..8
    const over = Math.min(1, (value - red) / Math.max(red, 0.0001));
    return Math.max(1, 4 - 3 * over);                                     // 1..4
  }

  function positiveScore(value, mid, high) {
    if (value == null) return null;
    if (value >= high) return 10;
    if (value >= mid)  return 7 + 3 * ((value - mid) / (high - mid));
    return 1 + 6 * (value / mid);
  }

  function scoreNutrient(key, n, condId) {
    const v = n[key];
    if (v == null) return null;
    switch (key) {
      case 'fat':           return bandScore(v, 3.0, 17.5);
      case 'saturated':     return bandScore(v, 1.5, 5.0);
      case 'sugars':        return bandScore(v, 5.0, 22.5);
      case 'salt':          return bandScore(v, 0.3, 1.5);
      case 'carbohydrates': return bandScore(v, 15, 60);
      case 'energy':        return bandScore(v, 150, 400);
      case 'fiber':         return positiveScore(v, 3, 6);
      case 'proteins':
        // For kidney disease a high protein load is a concern, not a benefit.
        if (condId === 'ckd') return bandScore(v, 6, 15);
        return positiveScore(v, 8, 20);
    }
    return null;
  }

  function tlLevel(key, value) {
    if (value == null) return null;
    const t = TL[key];
    if (value <= t.green) return 'green';
    if (value <= t.red)   return 'amber';
    return 'red';
  }

  function fmtNutrient(key, val) {
    if (val == null) return '—';
    if (key === 'energy') return Math.round(val) + ' kcal';
    const dec = (key === 'salt' || key === 'saturated') ? 2 : 1;
    return val.toFixed(dec) + ' g';
  }

  function scoreColor(score) {
    if (score == null) return '#6b6b70';
    if (score >= 7.5) return '#22c55e';
    if (score >= 5)   return '#fbbf24';
    if (score >= 3)   return '#fb923c';
    return '#ef4444';
  }

  function scoreWord(score) {
    if (score == null) return 'Not enough data';
    if (score >= 7.5) return 'Good choice';
    if (score >= 5)   return 'OK in moderation';
    if (score >= 3)   return 'Limit intake';
    return 'Best avoided';
  }

  function generalScore(n) {
    const parts = [
      ['fat', 1], ['saturated', 2], ['sugars', 2], ['salt', 2],
      ['fiber', 1.5], ['proteins', 1]
    ];
    let sum = 0, wsum = 0;
    for (const [k, w] of parts) {
      const s = scoreNutrient(k, n);
      if (s == null) continue;
      sum += s * w; wsum += w;
    }
    return wsum ? sum / wsum : null;
  }

  function scoreCondition(condId, n, allergens) {
    const rule = CONDITION_RULES[condId];
    if (!rule) return { score: null, alerts: [], good: [] };

    if (rule.allergen) {
      const has = (allergens || []).some(a =>
        String(a).toLowerCase().indexOf(rule.allergen) !== -1);
      if (has) return { score: 1, alerts: ['Contains ' + rule.allergen + ' — avoid'], good: [] };
      return { score: 10, alerts: [], good: ['No ' + rule.allergen + ' declared'] };
    }

    let sum = 0, wsum = 0;
    const alerts = [], good = [];
    for (const key in rule.nutrients) {
      if (!Object.prototype.hasOwnProperty.call(rule.nutrients, key)) continue;
      const w = rule.nutrients[key];
      const val = n[key];
      const s = scoreNutrient(key, n, condId);
      if (s == null || val == null) continue;
      sum += s * w; wsum += w;
      if (s <= 4) {
        alerts.push(NUTRIENT_LABELS[key] + ' ' + fmtNutrient(key, val) +
                    ' · ' + (s <= 2 ? 'very high' : 'high'));
      } else if (s >= 8.5 && (key === 'fiber' || key === 'proteins')) {
        good.push('Good ' + NUTRIENT_LABELS[key].toLowerCase());
      }
    }
    return { score: wsum ? sum / wsum : null, alerts, good };
  }

  // --------------------------- analysis render ---------------------------

  function renderAnalysis() {
    if (!lastProductData) {
      analysisEl.innerHTML = '';
      analysisEl.classList.remove('visible');
      return;
    }

    const n = extractNutrients(lastProductData);
    const allergens = lastProductData.allergens_tags || [];
    const activeConds = CONDITIONS.map(c => c.id).filter(id => !!profile.conditions[id]);

    const condResults = activeConds.map(id => {
      const r = scoreCondition(id, n, allergens) || { score: null, alerts: [], good: [] };
      return { id: id, score: r.score, alerts: r.alerts || [], good: r.good || [] };
    });

    let overall = null;
    let overallLabel = '';
    if (activeConds.length) {
      const valid = condResults.filter(r => r.score != null);
      if (valid.length) {
        overall = valid.reduce((s, r) => s + r.score, 0) / valid.length;
        overallLabel = 'Overall for your profile';
      } else {
        overallLabel = 'Nutrition data missing for your conditions';
      }
    } else {
      overall = generalScore(n);
      overallLabel = 'General health score';
    }

    const col = scoreColor(overall);
    const overallTxt = overall == null ? '?' : overall.toFixed(1);
    const parts = [];

    // -------- headline score --------
    parts.push(
      '<div class="score-wrap">' +
        '<div class="score-circle" style="--c:' + col + '">' + overallTxt + '</div>' +
        '<div class="score-meta">' +
          '<div class="score-title" style="color:' + col + '">' + scoreWord(overall) + '</div>' +
          '<div class="score-sub">' + overallLabel + ' · values per 100 g</div>' +
        '</div>' +
      '</div>'
    );

    // -------- traffic lights --------
    parts.push('<div class="tl-title">Nutrition traffic lights</div>');
    const tlKeys = ['sugars', 'salt', 'saturated', 'fat'];
    for (const k of tlKeys) {
      const val = n[k];
      const lvl = val == null ? null : tlLevel(k, val);
      const c = lvl === 'green' ? '#22c55e'
              : lvl === 'amber' ? '#fbbf24'
              : lvl === 'red'   ? '#ef4444'
              : '#3a3a40';
      const pct = val == null ? 0 : Math.min(100, (val / (TL[k].red * 1.6)) * 100);
      parts.push(
        '<div class="tl-row">' +
          '<span class="tl-dot" style="background:' + c + '"></span>' +
          '<span class="tl-name">' + TL[k].label + '</span>' +
          '<span class="tl-bar"><span class="tl-fill" style="width:' + pct + '%;background:' + c + '"></span></span>' +
          '<span class="tl-val">' + fmtNutrient(k, val) + '</span>' +
        '</div>'
      );
    }

    // -------- beneficial nutrients --------
    parts.push('<div class="tl-title">Beneficial</div>');
    const posKeys = [['fiber', 8], ['proteins', 25]];
    for (const [k, maxVal] of posKeys) {
      const val = n[k];
      const s = scoreNutrient(k, n);
      const c = scoreColor(s);
      const pct = val == null ? 0 : Math.min(100, (val / maxVal) * 100);
      parts.push(
        '<div class="tl-row">' +
          '<span class="tl-dot" style="background:' + c + '"></span>' +
          '<span class="tl-name">' + NUTRIENT_LABELS[k] + '</span>' +
          '<span class="tl-bar"><span class="tl-fill" style="width:' + pct + '%;background:' + c + '"></span></span>' +
          '<span class="tl-val">' + fmtNutrient(k, val) + '</span>' +
        '</div>'
      );
    }

    // -------- per-condition cards --------
    if (activeConds.length) {
      parts.push('<div class="tl-title">For your conditions</div>');
      parts.push('<div class="cond-list">');
      for (const r of condResults) {
        const cdef = CONDITIONS.find(x => x.id === r.id) || { label: r.id, icon: '' };
        const s = r.score;
        const cls = s == null ? '' : s >= 7.5 ? 'good' : s >= 5 ? 'warn' : 'bad';
        const notes = [];
        if (r.alerts && r.alerts.length) notes.push('⚠ ' + r.alerts.join(' · '));
        else if (s != null && s >= 7.5)   notes.push('✓ No major concerns');
        if (r.good && r.good.length)      notes.push('✓ ' + r.good.join(' · '));
        parts.push(
          '<div class="cond-card ' + cls + '">' +
            '<div class="cond-head">' +
              '<span class="ico">' + cdef.icon + '</span>' +
              '<span>' + cdef.label + '</span>' +
              '<span class="cond-score" style="color:' + scoreColor(s) + '">' +
                (s == null ? '—' : s.toFixed(1) + '/10') +
              '</span>' +
            '</div>' +
            (notes.length ? '<div class="cond-note">' + notes.join('<br>') + '</div>' : '') +
          '</div>'
        );
      }
      parts.push('</div>');
    } else {
      parts.push(
        '<div class="profile-note" style="margin-top:14px">' +
        'Add health conditions in your profile for personalised scoring.' +
        '</div>'
      );
    }

    parts.push('<div class="profile-note">Guidance only — not medical advice.</div>');

    analysisEl.innerHTML = parts.join('');
    analysisEl.classList.add('visible');
  }

  // ============================================================
  // ===================  END PROFILE + SCORING  ================
  // ============================================================

  // --------------------------------------------------- viewfinder region
  // Defines BOTH what's drawn on screen and what gets cropped for decoding,
  // so "in the box" and "what the decoder sees" are the same thing. It's
  // deliberately generous (not a tight rectangle) so a tilted or
  // upside-down code anywhere in it still gets picked up.
  function getRegion(vw, vh) {
    return { x: 0.06, y: 0.18, w: 0.88, h: 0.64 };
  }

  function updateOverlay() {
    const vw = video.videoWidth;
    const vh = video.videoHeight;
    if (!vw || !vh) { rectEl.classList.remove('on'); return; }

    const cw = stage.clientWidth;
    const ch = stage.clientHeight;
    const scale = Math.min(cw / vw, ch / vh);
    const dw = vw * scale, dh = vh * scale;
    const dx = (cw - dw) / 2, dy = (ch - dh) / 2;

    const r = getRegion(vw, vh);
    rectEl.style.left   = (dx + r.x * dw) + 'px';
    rectEl.style.top    = (dy + r.y * dh) + 'px';
    rectEl.style.width  = (r.w * dw) + 'px';
    rectEl.style.height = (r.h * dh) + 'px';
    rectEl.classList.add('on');
  }

  function flashRect(kind) {
    rectEl.classList.remove('hit');
    void rectEl.offsetWidth;
    rectEl.classList.add(kind);
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => rectEl.classList.remove('hit'), 450);
  }

  // ---------------------------------------------------------- show value
  function show(text) {
    const now = Date.now();
    if (text === lastText && now - lastAt < DEDUPE_MS) return;
    lastText = text;
    lastAt = now;

    codeEl.textContent = text;
    codeEl.classList.add('hit');
    setTimeout(() => codeEl.classList.remove('hit'), 400);

    const parsed = parseGS1(text);
    showGS1(parsed);
    if (navigator.vibrate) navigator.vibrate(35);

    log('DECODED: ' + text.substring(0, 40) + (text.length > 40 ? '…' : ''), 'ok');

    if (parsed) lookupOFF(text);
    else { clearProduct(); lastLookupCode = ''; }

    // Every hit here is a genuine 1D barcode (QR support was removed), so
    // always reveal the Barcode Lookup link and stop the camera — the user
    // has what they came for and can browse straight to it, or tap Start
    // again to scan another item.
    const digits = text.replace(/\D/g, '');
    const query = digits.length >= 6 ? digits : text;
    lookupLinkEl.href = BARCODE_LOOKUP_BASE + encodeURIComponent(query);
    lookupLinkEl.hidden = false;
    if (running) stop('Barcode detected — tap Start to scan again');
  }

  // ------------------------------------------------------- script loading
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = () => resolve();
      s.onerror = () => { s.remove(); reject(new Error('Failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }

  async function loadZXing() {
    if (window.ZXing) return window.ZXing;
    let lastErr;
    for (const url of ZXING_URLS) {
      try {
        log('ZXing: loading…');
        await loadScript(url);
        if (window.ZXing) { log('ZXing: loaded', 'ok'); return window.ZXing; }
      } catch (e) { lastErr = e; log('ZXing: load failed', 'warn'); }
    }
    throw lastErr || new Error('ZXing could not be loaded');
  }

  // Builds a MultiFormatReader configured for 1D barcodes only, using the
  // library's own low-level primitives (BinaryBitmap + HybridBinarizer +
  // HTMLCanvasElementLuminanceSource) rather than a convenience wrapper —
  // this is what actually exists and works in this ZXing build, verified
  // directly against the shipped package.
  function setupZXingCore(ZX) {
    const hints = new Map();
    hints.set(ZX.DecodeHintType.TRY_HARDER, true);
    const formats = [];
    for (const name of BARCODE_FORMATS) {
      const key = name.toUpperCase().replace(/-/g, '_');
      if (ZX.BarcodeFormat[key] !== undefined) formats.push(ZX.BarcodeFormat[key]);
    }
    hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS, formats);
    const reader = new ZX.MultiFormatReader();
    reader.setHints(hints);
    log('ZXing ready (' + formats.length + ' formats)', 'ok');
    return { Lib: ZX, reader };
  }

  function zxingDecode(canvas) {
    const src = new zxingCore.Lib.HTMLCanvasElementLuminanceSource(canvas);
    const binarizer = new zxingCore.Lib.HybridBinarizer(src);
    const bitmap = new zxingCore.Lib.BinaryBitmap(binarizer);
    return zxingCore.reader.decodeWithState(bitmap); // throws if nothing found
  }

  // ------------------------------------------------ camera acquisition
  // Try progressively more permissive constraint sets. Resolution is
  // pushed high (1920x1080 ideal) because we crop a small region out of
  // the frame for decoding instead of shrinking the whole frame — more
  // native pixels means more pixels on the barcode.
  async function acquireCamera() {
    const attempts = [
      { name: '1920x1080 env',
        v: { facingMode: { ideal: 'environment' },
             width:  { ideal: 1920 }, height: { ideal: 1080 },
             frameRate: { ideal: 30, max: 30 } } },
      { name: '1280x720 env',
        v: { facingMode: { ideal: 'environment' },
             width:  { ideal: 1280 }, height: { ideal: 720 },
             frameRate: { ideal: 30, max: 30 } } },
      { name: '1280x720 any',
        v: { width:  { ideal: 1280 }, height: { ideal: 720 } } },
      { name: '640x480 any',
        v: { width: { ideal: 640 }, height: { ideal: 480 } } },
      { name: 'default', v: true }
    ];

    let lastErr;
    for (const a of attempts) {
      try {
        const s = await navigator.mediaDevices.getUserMedia({ audio: false, video: a.v });
        const track = s.getVideoTracks()[0];
        const st = (track && track.getSettings) ? track.getSettings() : {};
        log('Camera ' + a.name + ' → ' + (st.width || '?') + '×' + (st.height || '?') +
            (st.frameRate ? ' @' + Math.round(st.frameRate) : ''), 'ok');
        return s;
      } catch (e) {
        lastErr = e;
        log('Camera ' + a.name + ' failed: ' + (e.name || e.message || 'error'), 'warn');
      }
    }
    throw lastErr || new Error('No camera available');
  }

  // Best-effort continuous autofocus. Unsupported on iOS Safari (WebKit
  // doesn't expose focusMode) — this simply does nothing there.
  async function tryEnableContinuousFocus() {
    const track = stream && stream.getVideoTracks()[0];
    if (!track || typeof track.getCapabilities !== 'function') return;
    let caps = {};
    try { caps = track.getCapabilities(); } catch (_) {}
    if (caps.focusMode && caps.focusMode.indexOf('continuous') !== -1) {
      try {
        await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        log('Continuous autofocus requested', 'ok');
      } catch (e) {
        log('Focus constraint failed: ' + (e.message || e), 'warn');
      }
    }
  }

  // Torch is not supported on iOS Safari — the button stays hidden there
  // (feature-detected, no UA sniffing) rather than showing a dead control.
  function setupTorch() {
    torchTrack = null;
    torchOn = false;
    torchBtn.hidden = true;
    torchBtn.classList.remove('on');
    const track = stream && stream.getVideoTracks()[0];
    if (!track || typeof track.getCapabilities !== 'function') return;
    let caps = {};
    try { caps = track.getCapabilities(); } catch (_) {}
    if (caps.torch) {
      torchTrack = track;
      torchBtn.hidden = false;
    }
  }

  async function toggleTorch() {
    if (!torchTrack) return;
    const next = !torchOn;
    try {
      await torchTrack.applyConstraints({ advanced: [{ torch: next }] });
      torchOn = next;
      torchBtn.classList.toggle('on', torchOn);
    } catch (e) {
      log('Torch toggle failed: ' + (e.message || e), 'warn');
    }
  }

  // ------------------------------------------------- crop + rotation
  function getCropRectPx(vw, vh) {
    const r = getRegion(vw, vh);
    let x = r.x * vw, y = r.y * vh, w = r.w * vw, h = r.h * vh;
    const padX = w * CROP_PADDING, padY = h * CROP_PADDING;
    x = Math.max(0, x - padX);
    y = Math.max(0, y - padY);
    w = Math.min(vw - x, w + 2 * padX);
    h = Math.min(vh - y, h + 2 * padY);
    return { x, y, w, h };
  }

  function makeCropCanvas() {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return null;
    const rect = getCropRectPx(vw, vh);
    let scale = 1;
    const maxDim = Math.max(rect.w, rect.h);
    if (maxDim > CROP_MAX_DIM) scale = CROP_MAX_DIM / maxDim;
    const cw = Math.max(1, Math.round(rect.w * scale));
    const ch = Math.max(1, Math.round(rect.h * scale));
    if (cropCanvas.width !== cw || cropCanvas.height !== ch) {
      cropCanvas.width = cw;
      cropCanvas.height = ch;
    }
    cropCtx.drawImage(video, rect.x, rect.y, rect.w, rect.h, 0, 0, cw, ch);
    return cropCanvas;
  }

  function rotatedCanvas(src, deg) {
    const swap = deg === 90 || deg === 270;
    const w = swap ? src.height : src.width;
    const h = swap ? src.width : src.height;
    if (rotCanvas.width !== w || rotCanvas.height !== h) {
      rotCanvas.width = w;
      rotCanvas.height = h;
    }
    rotCtx.save();
    rotCtx.clearRect(0, 0, w, h);
    rotCtx.translate(w / 2, h / 2);
    rotCtx.rotate(deg * Math.PI / 180);
    rotCtx.drawImage(src, -src.width / 2, -src.height / 2);
    rotCtx.restore();
    return rotCanvas;
  }

  // ------------------------------------------------------- decoding
  // Tries native BarcodeDetector first (fast, and on Android the more
  // rotation-tolerant of the two engines), then the ZXing core pipeline
  // on the same canvas as a backstop — and the only engine at all on
  // iOS, where BarcodeDetector doesn't exist.
  async function tryDecode(canvas) {
    if (nativeDetector) {
      try {
        const codes = await nativeDetector.detect(canvas);
        if (codes && codes.length) {
          const hit = codes.find(c => c && c.rawValue);
          if (hit) { flashRect('hit'); show(hit.rawValue); return true; }
        }
      } catch (e) {
        logThrottled('Native detect error: ' + (e.message || e), 'err');
      }
    }
    if (zxingCore) {
      try {
        const result = zxingDecode(canvas);
        if (result) { flashRect('hit'); show(result.getText()); return true; }
      } catch (e) {
        // NotFoundException / ChecksumException / FormatException:
        // nothing decoded on this attempt — expected most of the time.
      }
    }
    return false;
  }

  async function detectTick() {
    const base = makeCropCanvas();
    if (!base) return;

    // Upright first — the common case, kept fast (one draw, no rotation).
    if (await tryDecode(base)) return;

    // Round-robin one more orientation per tick so a sideways or
    // upside-down code is caught within a few ticks, without the cost of
    // trying all three extra angles on every single tick.
    const angle = EXTRA_ROTATIONS[rotCursor % EXTRA_ROTATIONS.length];
    rotCursor++;
    const rotated = rotatedCanvas(base, angle);
    await tryDecode(rotated);
  }

  function scheduleTick(cb) {
    if (video.requestVideoFrameCallback) {
      rvfcHandle = video.requestVideoFrameCallback(() => cb());
    } else {
      rafId = requestAnimationFrame(cb);
    }
  }

  function runLoop() {
    if (!running) return;
    const now = performance.now();
    if (!busy && now - lastTick >= DETECT_INTERVAL) {
      lastTick = now;
      busy = true;
      detectTick()
        .catch(e => logThrottled('Detect error: ' + (e.message || e), 'err'))
        .finally(() => { busy = false; });
    }
    scheduleTick(runLoop);
  }

  function waitForVideoSize() {
    return new Promise((resolve) => {
      if (video.videoWidth && video.videoHeight) { updateOverlay(); return resolve(); }
      let tries = 0;
      const tick = () => {
        if (video.videoWidth && video.videoHeight) { updateOverlay(); resolve(); }
        else if (tries++ < 40) setTimeout(tick, 50);
        else resolve();
      };
      tick();
    });
  }

  // ------------------------------------------------------------- lifecycle
  async function start() {
    if (running) return;
    running = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    codeEl.textContent = '—';
    gs1El.textContent = '';
    clearProduct();
    lookupLinkEl.hidden = true;
    lastText = '';
    lastLookupCode = '';
    log('--- start ---');
    setStatus('Starting camera…');

    try {
      stream = await acquireCamera();
      video.srcObject = stream;
      await video.play();
      await waitForVideoSize();
    } catch (err) {
      const m = err && err.message ? err.message : String(err);
      log('Camera failed: ' + m, 'err');
      setStatus('Error: ' + m);
      stop();
      return;
    }

    await tryEnableContinuousFocus();
    setupTorch();

    // Engine 1: native BarcodeDetector (absent on iOS Safari — expected).
    if ('BarcodeDetector' in window) {
      try {
        let formats = BARCODE_FORMATS;
        if (typeof BarcodeDetector.getSupportedFormats === 'function') {
          const supported = await BarcodeDetector.getSupportedFormats();
          const filtered = BARCODE_FORMATS.filter(f => supported.indexOf(f) !== -1);
          if (filtered.length) formats = filtered;
        }
        nativeDetector = new BarcodeDetector({ formats });
        log('Native BarcodeDetector ready (' + formats.length + ' formats)', 'ok');
      } catch (e) {
        nativeDetector = null;
        log('Native detector init failed: ' + (e.message || e), 'warn');
      }
    } else {
      log('Native BarcodeDetector not available (expected on iOS Safari)', 'warn');
    }

    setStatus(nativeDetector ? 'Scanning · native' : 'Loading decoder…');

    // Engine 2: ZXing core pipeline — always loaded, since it's the only
    // engine at all on iOS and a useful backstop on Android too.
    loadZXing().then((ZX) => {
      if (!running) return;
      zxingCore = setupZXingCore(ZX);
      if (!nativeDetector) setStatus('Scanning · ZXing');
    }).catch((e) => {
      log('ZXing failed to load: ' + (e.message || e), nativeDetector ? 'warn' : 'err');
      if (!nativeDetector) {
        setStatus('Error: no decoder available');
        stop();
      }
    });

    runLoop();
  }

  function stop(reason) {
    running = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    if (rvfcHandle && video.cancelVideoFrameCallback) {
      try { video.cancelVideoFrameCallback(rvfcHandle); } catch (_) {}
      rvfcHandle = 0;
    }
    busy = false;
    nativeDetector = null;
    zxingCore = null;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    try { video.pause(); } catch (_) {}
    video.srcObject = null;
    torchTrack = null;
    torchOn = false;
    torchBtn.hidden = true;
    torchBtn.classList.remove('on');
    rectEl.classList.remove('on', 'hit');
    startBtn.disabled = false;
    stopBtn.disabled = true;
    setStatus(reason || 'Stopped');
    log(reason ? '--- stopped: ' + reason + ' ---' : '--- stopped ---');
  }

  // ------------------------------------------------------------- wiring
  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', () => stop());
  torchBtn.addEventListener('click', toggleTorch);

  window.addEventListener('resize', updateOverlay);
  window.addEventListener('orientationchange', () => setTimeout(updateOverlay, 200));
  video.addEventListener('loadedmetadata', updateOverlay);

  window.addEventListener('pagehide', () => { if (running) stop(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && running) stop();
  });
})();
</script>
</body>
</html>
